      return { rate: all[d], date: d, exact: false, provisional: true, estimate: true, source: srcName(d), error: fetchError };
    }
    const provisional = !pick.exact && date > (S.fxThrough || "");
    return { rate: pick.rate, date: pick.date, exact: pick.exact, provisional, estimate: false, source: srcName(pick.date), error: fetchError };
  }
  function fxLabel(fx) {
    if (!fx) return "";
    if (fx.source === "Bank charge") return `Bank charge · ${fx.rate} per US$`;
    const when = E.fmtMD(fx.date);
    return `${fx.source === "ECB reference rate" ? "ECB" : "BoC"} ${fx.rate} · ${when}${fx.provisional ? " (provisional)" : ""}`;
  }

  // ---------- Rendering ----------
  let renderQueued = false;
  function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
  function keepFocus(fn) {
    const a = document.activeElement;
    const id = a && a.id && $("#view").contains(a) ? a.id : null;
    const sel = id && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
    fn();
    if (id) { const n = document.getElementById(id); if (n) { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } } }
  }
  function renderChrome() {
    const tabs = [["home", "Dashboard", ICON.home], ["tx", "Transactions", ICON.list], ["an", "Analytics", ICON.chart]];
    const btns = tabs.map(([k, label, icon]) => `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${icon}<span>${label}</span></button>`);
    $("#tabbar").innerHTML = btns[0] + btns[1] + `<span class="tab-add-slot"><button class="tab-add" data-act="add" aria-label="Add expenses">${ICON.plus}</button></span>` + btns[2];
    $("#rail-tabs").innerHTML = btns.join("");
  }
  function render() {
    S.today = E.localToday();
    renderChrome();
    const v = $("#view");
    keepFocus(() => {
      if (S.mode === "loading") v.innerHTML = `<div class="loading"><span class="dot"></span><span>Opening your ledger</span></div>`;
      else if (S.mode === "nodb") v.innerHTML = window.ALLOWANCE_STANDALONE ? `<div class="loading"><strong>This browser can't save data for the app.</strong><span>Turn off Private Browsing, or open the app in Safari or Chrome.</span></div>` : `<div class="loading"><strong>Open this page in Claude to use your ledger.</strong><span>Your expenses are saved with this page on claude.ai, so it needs to be opened there.</span></div>`;
      else if (S.mode === "private") v.innerHTML = `<div class="loading"><strong>This ledger is private.</strong><span>Only its owner can see and add expenses.</span></div>`;
      else if (S.tab === "home") v.innerHTML = viewHome();
      else if (S.tab === "tx") v.innerHTML = viewTx();
      else v.innerHTML = viewAnalytics();
    });
  }

  // ---------- Dashboard ----------
  function ensureWeek() {
    if (!S.weekOf) S.weekOf = S.today;
    const ws = E.weekStart(S.weekOf), we = E.addDays(ws, 6);
    if (!S.selDay || S.selDay < ws || S.selDay > we) S.selDay = (S.today >= ws && S.today <= we) ? S.today : (we < S.today ? we : ws);
  }
  function viewHome() {
    ensureWeek();
    const today = S.today;
    const w = E.weekSummary(S.txns, S.weekOf, S.settings);
    const isCurrent = w.start <= today && today <= w.end, isPast = w.end < today, isFuture = w.start > today;
    const sel = S.selDay;
    const a = E.allowance(S.txns, sel, today, S.settings);
    const status = E.budgetStatus(w.total, w.budget);
    const scale = Math.max(w.budget, w.total, 1);

    // Meter: one segment per day, in order
    let segs = "";
    for (const d of w.days) {
      if (d.cents <= 0) continue;
      segs += `<span class="meter-seg ${status}" style="width:calc(${(d.cents / scale) * 100}% - 2px)" data-tip="${esc(E.fmtDay(d.date) + "\n" + fmt(d.cents))}"></span>`;
    }
    const markers = [];
    if (isCurrent && status !== "over") {
      const paceCents = Math.round((w.budget * (E.dayIndex(today) + 1)) / 7);
      markers.push(`<span class="meter-pace" style="left:${pct(paceCents, scale)}%" data-tip="${esc("Even pace through " + E.DOW[E.dayIndex(today)] + "\n" + fmt(paceCents))}"></span>`);
    }
    if (w.total > w.budget) markers.push(`<span class="meter-pace" style="left:${pct(w.budget, scale)}%" data-tip="${esc("Budget\n" + fmt(w.budget))}"></span>`);
    const usedPct = Math.round((w.total / w.budget) * 100);
    const legendRight = isCurrent && status !== "over"
      ? `Even pace through ${E.DOW[E.dayIndex(today)]}: ${fmt(Math.round((w.budget * (E.dayIndex(today) + 1)) / 7))}`
      : w.total > w.budget ? `Line marks the ${fmt(w.budget, { whole: true })} budget` : `${fmt(Math.round(w.budget / 7))} a day on average`;

    let pill;
    if (isPast) pill = w.total > w.budget ? `<span class="pill over">${ICON.over}Over by ${fmt(w.total - w.budget)}</span>` : `<span class="pill ok">${ICON.check}Under by ${fmt(w.budget - w.total)}</span>`;
    else if (isFuture) pill = `<span class="pill plain">Upcoming</span>`;
    else pill = `<span class="pill ${status}">${STATUS_ICON[status]}${status === "over" ? "Over by " + fmt(w.total - w.budget) : STATUS_LABEL[status]}</span>`;

    // Stats under the meter
    let stats;
    const asOf = a.asOfPast ? ` as of ${E.DOW[E.dayIndex(sel)]}` : "";
    if (isPast) {
      stats = `<div class="stat"><div class="label">Week result</div><div class="val ${w.total > w.budget ? "over" : ""}">${w.total > w.budget ? "−" + fmt(w.total - w.budget) : fmt(w.budget - w.total)}</div><div class="sub">${w.total > w.budget ? "over budget" : "left unspent (doesn't carry over)"}</div></div>
        <div class="stat"><div class="label">Daily average</div><div class="val">${fmt(Math.round(w.total / 7))}</div><div class="sub">${fmt(w.total)} ÷ 7 days</div></div>`;
    } else if (isFuture) {
      stats = `<div class="stat"><div class="label">Budget</div><div class="val">${fmt(w.budget)}</div></div><div class="stat"><div class="label">Per day</div><div class="val">${fmt(Math.floor(w.budget / 7))}</div><div class="sub">${fmt(w.budget)} ÷ 7 days</div></div>`;
    } else if (a.kind === "over") {
      stats = `<div class="stat"><div class="label">Over budget by${asOf}</div><div class="val over">${fmt(a.over)}</div><div class="sub">${fmt(a.spent)} spent of ${fmt(a.budget)}</div></div>
        <div class="stat"><div class="label">Daily allowance</div><div class="val">None left</div><div class="sub">Anything more adds to the overspend</div></div>`;
    } else if (a.kind === "last") {
      stats = `<div class="stat"><div class="label">Left this week${asOf}</div><div class="val">${fmt(a.remaining)}</div></div>
        <div class="stat"><div class="label">Left for Sunday</div><div class="val">${fmt(a.remaining)}</div><div class="sub">Sunday is the last day of the week</div></div>`;
    } else {
      const span = a.dayNames.length > 1 ? `${a.dayNames[0]}–${a.dayNames[a.dayNames.length - 1]}` : a.dayNames[0];
      const incl = a.kind === "including" ? `, ${sel === today ? "today" : E.DOW[E.dayIndex(sel)]} included` : "";
      stats = `<div class="stat"><div class="label">Left this week${asOf}</div><div class="val">${fmt(a.remaining)}</div><div class="sub">${fmt(a.spent)} spent</div></div>
        <div class="stat"><div class="label">Per day left</div><div class="val">${fmt(a.perDay)}</div><div class="sub">${fmt(a.remaining)} ÷ ${plural(a.days, "day")} · ${span}${incl}</div></div>`;
    }

    const hero = `<section class="hero" aria-label="Weekly budget">
      <div class="hero-top">
        <div><div class="eyebrow">Week ${w.week} · ${esc(E.fmtRange(w.start, w.end))}${isPast ? " · Final" : ""}</div>
          <div class="hero-amt">${fmt(w.total)}</div>
          <div class="hero-of">of ${fmt(w.budget)} weekly budget</div></div>
        ${pill}
      </div>
      <div class="meter" role="img" aria-label="${esc(`${fmt(w.total)} of ${fmt(w.budget)} used`)}"><div class="meter-track">${segs}</div>${markers.join("")}</div>
      <div class="meter-legend"><span>${usedPct}% used</span><span>${esc(legendRight)}</span></div>
      <div class="hero-stats">${stats}</div>
    </section>`;

    // Day strip
    const daily = Math.round(w.budget / 7);
    const maxDay = Math.max(daily * 2, ...w.days.map((d) => d.cents));
    const dayBtns = w.days.map((d, i) => {
      const future = d.date > today;
      const h = d.cents > 0 ? Math.max(3, (d.cents / maxDay) * 100) : 0;
      const cls = ["day", d.date === today ? "today" : ""].join(" ");
      const bar = future && d.count === 0 ? "" : `<span class="bar ${d.cents <= 0 ? "zero" : ""}" style="height:${d.cents > 0 ? h : 0}%"></span>`;
      return `<button class="${cls}" data-act="day" data-date="${d.date}" aria-pressed="${d.date === sel}" aria-label="${esc(E.fmtDayLong(d.date) + ", " + fmt(d.cents))}">
        <span class="dname">${E.DOW[i]}</span><span class="dnum">${+d.date.slice(8)}</span>
        <span class="bar-wrap"><span class="ref" style="position:absolute;left:-5px;right:-5px;bottom:${(daily / maxDay) * 100}%;border-top:1px solid var(--line-strong)"></span>${bar}</span>
        <span class="damt ${d.cents === 0 ? "zero" : ""}">${d.count || d.cents ? fmt(d.cents, { whole: d.cents >= 10000 }) : "—"}</span>
      </button>`;
    }).join("");
    const strip = `<section class="card" aria-label="Spending by day">
      <div class="weeknav">
        <button class="icon-btn" data-act="wk" data-d="-7" aria-label="Previous week">${ICON.left}</button>
        <span class="wk">${esc(E.fmtRange(w.start, w.end))}<small>${isCurrent ? "This week" : isPast && E.addDays(w.end, 7) >= today ? "Last week" : ""}</small></span>
        <button class="icon-btn" data-act="wk" data-d="7" aria-label="Next week">${ICON.right}</button>
        <span class="grow"></span>
        ${isCurrent ? "" : `<button class="btn sm" data-act="wk-now">This week</button>`}
      </div>
      <div class="days">${dayBtns}</div>
      <div class="days-caption"><span>Line: ${fmt(daily)} a day</span><span>Total ${fmt(w.total)}</span></div>
    </section>`;

    // Selected day
    const dayList = S.txns.filter((t) => t.date === sel).sort((x, y) => String(x.created_at || "").localeCompare(String(y.created_at || "")));
    const dayTotal = E.sumCents(dayList);
    const dayHead = sel === today ? "Today" : sel === E.addDays(today, -1) ? "Yesterday" : E.DOW_LONG[E.dayIndex(sel)];
    const dayCard = `<section class="card" aria-label="Spending on ${esc(E.fmtDayLong(sel))}">
      <div class="daycard-head"><div><div class="eyebrow">${esc(dayHead)}</div><h2>${esc(E.fmtDayLong(sel))}</h2></div><div class="daycard-total">${fmt(dayTotal)}</div></div>
      ${dayList.length ? `<ul class="receipt" style="margin-top:6px">${dayList.map(txRow).join("")}</ul>
        <div class="rtotal"><span>${plural(dayList.length, "expense")}</span><span class="num">${fmt(dayTotal)}</span></div>`
        : `<div class="empty"><strong>Nothing spent ${sel === today ? "today" : "on " + E.DOW_LONG[E.dayIndex(sel)]}</strong>${S.txns.length ? "" : "Tap + and type something like 25.99 chipotle."}</div>`}
      <div style="margin-top:10px"><button class="btn ghost" data-act="add" data-date="${sel}">${ICON.plus}Add to ${esc(sel === today ? "today" : E.DOW_LONG[E.dayIndex(sel)])}</button></div>
    </section>`;

    // Side cards
    const side = [];
    if (window.ALLOWANCE_STANDALONE && S.txns.length >= 10 && S.lastBackup !== null) {
      const days = S.lastBackup ? E.diffDays(S.lastBackup.slice(0, 10), today) : null;
      if (days === null || days > 30) side.push(`<button class="mini-result" data-act="backup"><span><span class="t">Your expenses are only on this phone</span><br><span class="v">Download a backup <small class="muted">${days === null ? "never backed up" : "last one " + days + " days ago"}</small></span></span>${ICON.download}</button>`);
    }
    const reviewN = S.txns.filter((t) => t.review).length;
    if (reviewN) side.push(`<button class="mini-result" data-act="review"><span><span class="t">Needs a look</span><br><span class="v">${plural(reviewN, "expense")} to check</span></span><span class="flag">Review</span></button>`);
    if (isCurrent) {
      const lw = E.weekSummary(S.txns, E.addDays(w.start, -7), S.settings);
      const d = lw.budget - lw.total;
      side.push(`<button class="mini-result" data-act="week-report" data-start="${lw.start}"><span><span class="t">Last week · ${esc(E.fmtRange(lw.start, lw.end))}</span><br><span class="v num">${fmt(lw.total)} <small class="${d < 0 ? "bad-t" : "good-t"}">${d < 0 ? fmt(-d) + " over" : fmt(d) + " under"}</small></span></span>${ICON.right}</button>`);
      const mk = E.monthKey(today);
      const m = E.monthReport(S.txns, mk, S.settings, today);
      side.push(`<button class="mini-result" data-act="month-report" data-month="${mk}"><span><span class="t">${esc(E.MONTHS_LONG[+mk.slice(5) - 1])} so far · ${m.daysCounted} days</span><br><span class="v num">${fmt(m.total)} <small class="muted">of ${fmt(m.benchmarkToDate)} at $${(m.benchmarkToDate / m.daysCounted / 100).toFixed(0)}/day</small></span></span>${ICON.right}</button>`);
    } else {
      side.push(`<button class="mini-result" data-act="week-report" data-start="${w.start}"><span><span class="t">Week ${w.week} report</span><br><span class="v">Top 5 spending and daily totals</span></span>${ICON.right}</button>`);
    }
    return `<div class="dash"><div class="col">${hero}${strip}</div><div class="col">${dayCard}${side.join("")}</div></div>`;
  }

  function txSub(t) {
    const parts = [];
    if (t.description) parts.push(esc(t.description));
    if (t.splits && t.splits.length) parts.push(`split ${t.splits.length} ways`);
    else parts.push(esc(t.type && E.isGroupMerchant(t.merchant, S.settings) ? t.type : t.category));
    return parts.join(" · ");
  }
  function txRow(t, opts) {
    const o = opts || {};
    const flag = t.review ? `<span class="flag">${t.review === "fx" ? "Check the CAD amount" : t.review === "split" ? "Check the split" : "Pick a category"}</span>` : "";
    const amt = o.cents !== undefined ? o.cents : t.amount_cents;
    const usdLine = t.currency === "USD" ? `<small>${usd(t.original_cents)}</small>` : o.cents !== undefined && o.cents !== t.amount_cents ? `<small>of ${fmt(t.amount_cents)}</small>` : "";
    return `<li><button class="rrow" data-act="open-tx" data-id="${esc(t.id)}"><span class="rmain"><span class="rname">${esc(t.merchant)}</span><span class="rsub">${flag || txSub(t)}</span></span><span class="ramt">${fmt(amt)}${usdLine}</span></button></li>`;
  }

  // ---------- Transactions ----------
  function periodRange(p, from, to) {
    const t = S.today;
    switch (p) {
      case "week": return [E.weekStart(t), E.weekEnd(t)];
      case "lastweek": return [E.addDays(E.weekStart(t), -7), E.addDays(E.weekStart(t), -1)];
      case "month": return [E.monthStart(E.monthKey(t)), E.monthEnd(E.monthKey(t))];
      case "lastmonth": { const m = E.addMonths(E.monthKey(t), -1); return [E.monthStart(m), E.monthEnd(m)]; }
      case "30d": return [E.addDays(t, -29), t];
      case "90d": return [E.addDays(t, -89), t];
      case "year": return [t.slice(0, 4) + "-01-01", t.slice(0, 4) + "-12-31"];
      case "custom": return [E.isDate(from) ? from : "0000-01-01", E.isDate(to) ? to : "9999-12-31"];
      default: return ["0000-01-01", "9999-12-31"];
    }
  }
  const PERIODS = [["week", "This week"], ["lastweek", "Last week"], ["month", "This month"], ["lastmonth", "Last month"], ["30d", "Last 30 days"], ["90d", "Last 90 days"], ["year", "This year"], ["all", "All time"], ["custom", "Custom dates"]];
  function matchesQuery(t, q) {
    if (!q) return true;
    const hay = [t.merchant, t.description, t.notes, t.category, t.type, E.centsToDecimal(t.amount_cents), t.currency === "USD" ? E.centsToDecimal(t.original_cents) : "",
      ...(t.splits || []).map((s) => `${s.category} ${s.type || ""} ${s.note || ""}`)].join(" ").toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
  }
  function txFiltered() {
    const [a, b] = periodRange(S.tx.period, S.tx.from, S.tx.to);
    let list = S.txns.filter((t) => t.date >= a && t.date <= b);
    if (S.tx.review) list = list.filter((t) => t.review);
    if (S.tx.cat) list = list.filter((t) => E.portions(t).some((p) => p.category === S.tx.cat));
    if (S.tx.q.trim()) list = list.filter((t) => matchesQuery(t, S.tx.q.trim()));
    return { list, a, b };
  }
  function catCents(t, cat) { return E.portions(t).filter((p) => p.category === cat).reduce((s, p) => s + p.cents, 0); }
  function viewTx() {
    const { list } = txFiltered();
    const total = S.tx.cat ? list.reduce((s, t) => s + catCents(t, S.tx.cat), 0) : E.sumCents(list);
    const byDay = new Map();
    for (const t of list.slice().reverse()) { if (!byDay.has(t.date)) byDay.set(t.date, []); byDay.get(t.date).push(t); }
    const groups = Array.from(byDay.entries()).sort((x, y) => (x[0] < y[0] ? 1 : -1)).map(([d, ts]) => {
      const dt = S.tx.cat ? ts.reduce((s, t) => s + catCents(t, S.tx.cat), 0) : E.sumCents(ts);
      return `<section class="dgroup"><div class="dgroup-head"><span>${esc(E.fmtDayLong(d))}</span><span class="num">${fmt(dt)}</span></div><ul class="receipt">${ts.map((t) => txRow(t, S.tx.cat ? { cents: catCents(t, S.tx.cat) } : undefined)).join("")}</ul></section>`;
    }).join("");
    const periodOpts = PERIODS.map(([k, l]) => `<option value="${k}" ${S.tx.period === k ? "selected" : ""}>${l}</option>`).join("");
    const catOpts = `<option value="">All categories</option>` + E.CATEGORIES.map((c) => `<option ${S.tx.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("");
    return `<h1 class="view-title">Transactions</h1>
      <div class="toolbar">
        <label class="search"><span class="sr">Search</span>${ICON.search}<input class="input" id="tx-q" type="search" placeholder="Search merchants, notes, amounts" value="${esc(S.tx.q)}" data-input="tx-q" autocomplete="off"></label>
        <div class="filters">
          <select class="select" id="tx-period" data-change="tx-period" aria-label="Period">${periodOpts}</select>
          <select class="select" id="tx-cat" data-change="tx-cat" aria-label="Category">${catOpts}</select>
        </div>
        ${S.tx.period === "custom" ? `<div class="grid2"><label class="field"><span>From</span><input class="input" type="date" id="tx-from" value="${esc(S.tx.from)}" data-change="tx-from"></label><label class="field"><span>To</span><input class="input" type="date" id="tx-to" value="${esc(S.tx.to)}" data-change="tx-to"></label></div>` : ""}
      </div>
      <div class="summary-line"><span><strong class="num">${fmt(total)}</strong> · ${plural(list.length, "expense")}${S.tx.cat ? ` · only the ${esc(S.tx.cat)} part of splits counts` : ""}</span>
        <span class="row"><label class="toggle"><input type="checkbox" id="tx-review" data-change="tx-review" ${S.tx.review ? "checked" : ""}>Needs a look</label>
        <button class="btn sm" data-act="export-filtered" ${list.length ? "" : "disabled"}>${ICON.download}CSV</button></span></div>
      ${groups || `<div class="empty card"><strong>No expenses here</strong>${S.txns.length ? "Try another period or clear the search." : "Tap + to add your first expense."}</div>`}`;
  }

  // ---------- Analytics ----------
  const RANGES = [["8w", "8 weeks"], ["3m", "3 months"], ["6m", "6 months"], ["1y", "12 months"], ["all", "All"], ["custom", "Custom"]];
  function anRange() {
    const t = S.today, mk = E.monthKey(t);
    const first = S.txns.length ? S.txns[0].date : t;
    switch (S.an.range) {
      case "8w": return [E.addDays(E.weekStart(t), -49), E.weekEnd(t)];
      case "6m": return [E.monthStart(E.addMonths(mk, -5)), E.monthEnd(mk)];
      case "1y": return [E.monthStart(E.addMonths(mk, -11)), E.monthEnd(mk)];
      case "all": return [E.monthStart(E.monthKey(first < t ? first : t)), E.monthEnd(mk)];
      case "custom": return [E.isDate(S.an.from) ? S.an.from : E.monthStart(mk), E.isDate(S.an.to) ? S.an.to : t];
      default: return [E.monthStart(E.addMonths(mk, -2)), E.monthEnd(mk)];
    }
  }
  function viewAnalytics() {
    const subs = [["trends", "Trends"], ["weeks", "Weekly reports"], ["months", "Monthly reports"], ["calendar", "Calendar"]];
    const subNav = `<div class="seg" role="tablist" style="margin-bottom:12px">${subs.map(([k, l]) => `<button data-act="an-sub" data-sub="${k}" aria-pressed="${S.an.sub === k}">${l}</button>`).join("")}</div>`;
    const showRange = S.an.sub !== "calendar";
    const rangeNav = showRange ? `<div class="row wrap" style="margin-bottom:12px"><div class="seg">${RANGES.map(([k, l]) => `<button data-act="an-range" data-range="${k}" aria-pressed="${S.an.range === k}">${l}</button>`).join("")}</div>
      ${S.an.range === "custom" ? `<input class="input" style="max-width:170px" type="date" id="an-from" value="${esc(S.an.from)}" data-change="an-from" aria-label="From"><input class="input" style="max-width:170px" type="date" id="an-to" value="${esc(S.an.to)}" data-change="an-to" aria-label="To">` : ""}</div>` : "";
    let body = "";
    if (!S.txns.length) body = `<div class="card empty"><strong>Charts appear once you've added expenses</strong>Tap + and type something like 25.99 chipotle.</div>`;
    else if (S.an.sub === "weeks") body = viewWeeks();
    else if (S.an.sub === "months") body = viewMonths();
    else if (S.an.sub === "calendar") body = viewCalendar();
    else body = viewTrends();
    return `<h1 class="view-title">Analytics</h1>${subNav}${rangeNav}${body}`;
  }
  function niceMax(c) {
    if (c <= 0) return 10000;
    const d = c / 100, p = Math.pow(10, Math.floor(Math.log10(d))), m = d / p;
    const n = m <= 1 ? 1 : m <= 1.5 ? 1.5 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 3 ? 3 : m <= 4 ? 4 : m <= 5 ? 5 : m <= 6 ? 6 : m <= 8 ? 8 : 10;
    return Math.round(n * p * 100);
  }
  function colChart(o) {
    const cols = o.cols;
    const top = niceMax(Math.max(1, ...cols.map((c) => Math.max(c.value, c.tick || 0)), o.ref || 0));
    const grid = [0.5, 1].map((f) => `<div class="cc-grid" style="bottom:${f * 100}%"><span>${E.fmtCompact(top * f)}</span></div>`).join("") + `<div class="cc-grid" style="bottom:0;border-top:0"><span>$0</span></div>`;
    const ref = o.ref ? `<div class="cc-ref" style="bottom:${pct(o.ref, top)}%"><span>${esc(o.refLabel || "")}</span></div>` : "";
    const every = cols.length <= 9 ? 1 : cols.length <= 18 ? 2 : cols.length <= 36 ? 4 : 8;
    const bars = cols.map((c) => `<button class="cc-col" style="position:relative" data-tip="${esc(c.tip)}" aria-label="${esc(c.tip.replace(/\n/g, ", "))}" ${c.act ? `data-act="${c.act}" ${c.data || ""}` : ""}><span class="cc-bar ${c.cls || ""}" style="height:${c.value > 0 ? Math.max(1, pct(c.value, top)) : 0}%"></span>${c.tick ? `<span class="cc-tick" style="bottom:${pct(c.tick, top)}%"></span>` : ""}</button>`).join("");
    const xs = cols.map((c, i) => `<span>${i % every === 0 || i === cols.length - 1 && cols.length <= 9 ? esc(c.label) : ""}</span>`).join("");
    return `<div class="colchart"><div class="cc-plot">${grid}${ref}<div class="cc-cols">${bars}</div></div><div class="cc-x">${xs}</div></div>`;
  }
  function hbars(items, o) {
    const opts = o || {};
    const max = Math.max(1, ...items.map((i) => i.cents));
    return `<ol class="hbars">${items.map((i) => `<li><span class="hb-name">${esc(i.name)}${i.meta ? `<span class="hb-meta">${esc(i.meta)}</span>` : ""}</span><span class="hb-val">${fmt(i.cents)}</span><span class="hb-track"><span class="hb-fill" style="width:${pct(i.cents, max)}%"></span></span></li>`).join("")}</ol>${opts.more ? `<p class="note" style="margin:10px 0 0">${esc(opts.more)}</p>` : ""}`;
  }
  function tableDetails(head, rows) {
    return `<details class="tbl"><summary>Show as table</summary><div class="table-wrap"><table class="t"><thead><tr>${head.map((h, i) => `<th class="${i ? "r" : ""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? "r" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  }
  function viewTrends() {
    const [a, b] = anRange();
    const list = E.txnsIn(S.txns, a, b);
    const total = E.sumCents(list);
    const weeks = E.weeklySeries(S.txns, a, b, S.settings).filter((w) => w.start <= S.today);
    const doneWeeks = weeks.filter((w) => w.end < S.today && w.start >= E.weekStart(a));
    const overN = doneWeeks.filter((w) => w.total > w.budget).length;
    const avgWeek = doneWeeks.length ? Math.round(E.sumCents(doneWeeks.map((w) => ({ amount_cents: w.total }))) / doneWeeks.length) : 0;
    const lastDay = b < S.today ? b : S.today;
    const nDays = Math.max(1, E.diffDays(a, lastDay) + 1);
    const kpis = `<div class="kpis">
      <div class="kpi"><div class="label">Spent</div><div class="val">${fmt(total)}</div><div class="sub">${esc(E.fmtRange(a, lastDay))}</div></div>
      <div class="kpi"><div class="label">Average week</div><div class="val">${doneWeeks.length ? fmt(avgWeek) : "—"}</div><div class="sub">${plural(doneWeeks.length, "full week")}</div></div>
      <div class="kpi"><div class="label">Weeks over budget</div><div class="val">${doneWeeks.length ? `${overN} of ${doneWeeks.length}` : "—"}</div><div class="sub">${doneWeeks.length ? fmt(doneWeeks.reduce((s, w) => s + Math.max(0, w.total - w.budget), 0)) + " overspent in total" : "No finished weeks yet"}</div></div>
      <div class="kpi"><div class="label">Average day</div><div class="val">${fmt(Math.round(total / nDays))}</div><div class="sub">${plural(nDays, "day")}</div></div>
    </div>`;
    const budgetNow = E.weeklyBudget(E.weekStart(S.today), S.settings);
    const wkChart = colChart({
      cols: weeks.map((w) => ({ label: E.fmtMD(w.start), value: w.total, cls: (w.total > w.budget ? "over" : "") + (w.end >= S.today ? " cur" : ""), tip: `Week of ${E.fmtRange(w.start, w.end)}\n${fmt(w.total)} of ${fmt(w.budget)}\n${w.total > w.budget ? fmt(w.total - w.budget) + " over" : fmt(w.budget - w.total) + " under"}${w.end >= S.today ? "\nIn progress" : ""}`, act: "week-report", data: `data-start="${w.start}"` })),
      ref: budgetNow, refLabel: `${fmt(budgetNow, { whole: true })} budget`
    });
    const months = E.monthlySeries(S.txns, E.monthKey(a), E.monthKey(b), S.settings);
    const moChart = colChart({
      cols: months.map((m) => ({ label: E.fmtMonthShort(m.month), value: m.cents, tick: m.benchmark, cls: E.monthEnd(m.month) >= S.today ? "cur" : "", tip: `${E.fmtMonth(m.month)}\n${fmt(m.cents)} spent\nBenchmark ${fmt(m.benchmark)}`, act: "month-report", data: `data-month="${m.month}"` }))
    });
    const cats = E.categoryTotals(list).filter((c) => c.cents > 0);
    const merchants = E.merchantTotals(list).filter((m) => m.cents > 0);
    const topM = merchants.slice(0, 12).map((m) => ({ name: m.name, cents: m.cents, meta: plural(m.count, "visit") }));
    return `${kpis}<div class="an-grid">
      <section class="card wide"><div class="card-head"><h2>Weekly spending</h2><span class="note">Mon–Sun weeks</span></div>${wkChart}
        <div class="legend"><span><i style="background:var(--accent)"></i>Within budget</span><span><i style="background:var(--bad)"></i>Over budget</span><span><i class="line" style="background:var(--ink-2)"></i>Weekly budget</span><span><i style="background:color-mix(in srgb, var(--accent) 45%, var(--surface))"></i>This week so far</span></div>
        ${tableDetails(["Week", "Spent", "Budget", "Result"], weeks.map((w) => [E.fmtRange(w.start, w.end), fmt(w.total), fmt(w.budget), w.total > w.budget ? fmt(w.total - w.budget) + " over" : fmt(w.budget - w.total) + " under"]))}</section>
      <section class="card"><div class="card-head"><h2>Monthly spending</h2><span class="note">Tick: $${(budgetNow / 700).toFixed(0)}/day benchmark</span></div>${moChart}
        ${tableDetails(["Month", "Spent", "Benchmark"], months.map((m) => [E.fmtMonth(m.month), fmt(m.cents), fmt(m.benchmark)]))}</section>
      <section class="card"><div class="card-head"><h2>By category</h2><span class="note">Splits counted by part</span></div>${cats.length ? hbars(cats) : `<p class="note">Nothing in this range.</p>`}</section>
      <section class="card wide"><div class="card-head"><h2>Top merchants</h2><span class="note">${plural(merchants.length, "merchant")}</span></div>${topM.length ? hbars(topM, { more: merchants.length > 12 ? `${merchants.length - 12} more merchants: ${fmt(E.sumCents(merchants.slice(12).map((m) => ({ amount_cents: m.cents }))))}` : "" }) : `<p class="note">Nothing in this range.</p>`}</section>
    </div>`;
  }
  function viewWeeks() {
    const [a, b] = anRange();
    const weeks = E.weeklySeries(S.txns, a, b, S.settings).filter((w) => w.start <= S.today).reverse();
    return weeks.map((w) => {
      const final = w.end < S.today, d = w.budget - w.total;
      return `<button class="listrow" data-act="week-report" data-start="${w.start}"><span class="lr-main"><span class="lr-title">Week ${w.week} · ${esc(E.fmtRange(w.start, w.end))}</span><br><span class="lr-sub">${final ? "Final" : "In progress"}</span></span>
        <span class="lr-val">${fmt(w.total)}<small class="${d < 0 ? "bad-t" : final ? "good-t" : "muted"}">${d < 0 ? fmt(-d) + " over" : fmt(d) + (final ? " under" : " left")}</small></span>${ICON.right}</button>`;

  function viewMonths() {
    const [a, b] = anRange();

    for (let m = E.monthKey(b); m >= E.monthKey(a); m = E.addMonths(m, -1)) {
      if (E.monthStart(m) > S.today) continue;
      const r = E.monthReport(S.txns, m, S.settings, S.today);
      const bench = r.complete ? r.benchmark : r.benchmarkToDate;
      const d = bench - r.total;
      out.push(`<button class="listrow" data-act="month-report" data-month="${m}"><span class="lr-main"><span class="lr-title">${esc(E.fmtMonth(m))}</span><br><span class="lr-sub">${r.complete ? "Final" : "In progress"} · ${plural(r.count, "expense")}</span></span>

  function heatClass(c, daily) { if (c <= 0) return ""; if (c <= daily * 0.5) return "h1"; if (c <= daily) return "h2"; if (c <= daily * 2) return "h3"; return "h4"; }
  function viewCalendar() {

      <div class="summary-line" style="margin-top:14px"><span>Month total <strong class="num">${fmt(r.total)}</strong></span><button class="link" data-act="month-report" data-month="${mk}">Month report</button></div></section>`;

  // ---------- Reports (sheets) ----------
  function top5Html(groups) {

      const shown = g.items.slice(0, 4);

      return `<li><div class="t5-head"><span class="t5-rank">${i + 1}</span><span class="t5-name">${esc(g.name)}</span><span class="t5-val">${fmt(g.cents)}</span></div>${items}</li>`;
    }).join("")}</ol>`;
  }
  function openWeekReport(start) {

    const d = r.budget - r.total;
    const result = r.inProgress ? (d < 0 ? `<span class="bad-t">${fmt(-d)} over</span>` : `${fmt(d)} left`) : d < 0 ? `<span class="bad-t">${fmt(-d)} over</span>` : `<span class="good-t">${fmt(d)} under</span>`;

        <div class="kpi"><div class="label">Spent</div><div class="val">${fmt(r.total)}</div><div class="sub">${plural(r.count, "expense")}</div></div>
        <div class="kpi"><div class="label">Budget</div><div class="val">${fmt(r.budget)}</div><div class="sub">Mon–Sun</div></div>
        <div class="kpi"><div class="label">${r.inProgress ? "So far" : "Result"}</div><div class="val">${result}</div><div class="sub">${r.final ? "Final" : r.inProgress ? "In progress" : "Upcoming"}</div></div>

  function openMonthReport(mk) {
    const r = E.monthReport(S.txns, mk, S.settings, S.today);
    const sh = openSheet({ title: E.fmtMonth(mk) });
    const bench = r.complete ? r.benchmark : r.benchmarkToDate;
    const vs = bench - r.total;
    const perDay = Math.round(bench / (r.complete ? r.days.length : r.daysCounted));
    const prevChange = r.prevTotal ? ((r.total - r.prevTotal) / r.prevTotal) * 100 : null;
    const weeks = r.weeks.filter((w) => !w.future).map((w) => {
      const d = w.budget - w.total;
      return `<button class="listrow" data-x="wk" data-start="${w.start}"><span class="lr-main"><span class="lr-title">${esc(E.fmtRange(w.start, w.end))}</span><br><span class="lr-sub">${w.crosses ? "Full Mon–Sun week, crosses months" : "Week " + w.week}${w.inProgress ? " · in progress" : ""}</span></span><span class="lr-val">${fmt(w.total)}<small class="${d < 0 ? "bad-t" : w.final ? "good-t" : "muted"}">${d < 0 ? fmt(-d) + " over" : fmt(d) + (w.final ? " under" : " left")}</small></span></button>`;

    sh.body.innerHTML = `<table class="metrics">

        <tr><th>Benchmark${r.complete ? "" : " to date"}</th><td>${fmt(bench)}<small>$${(perDay / 100).toFixed(2)}/day × ${plural(r.complete ? r.days.length : r.daysCounted, "day")}</small></td></tr>
        <tr><th>Against benchmark</th><td class="${vs < 0 ? "bad-t" : "good-t"}">${vs < 0 ? fmt(-vs) + " over" : fmt(vs) + " under"}</td></tr>
        <tr><th>Vs. previous month</th><td>${prevChange === null ? "—" : (prevChange >= 0 ? "+" : "−") + Math.abs(prevChange).toFixed(1) + "%"}<small>${esc(E.fmtMonth(E.addMonths(mk, -1)))}: ${fmt(r.prevTotal)}</small></td></tr>
      </table>
      <p class="note" style="margin:-4px 0 0">The benchmark is your weekly budget spread over each day (${fmt(E.weeklyBudget(E.weekStart(r.start), S.settings))} ÷ 7), so a 31-day month gets more than a 30-day one. Weeks that cross into another month count only their days in this month.</p>

  function openDaySheet(date) {

  // ---------- Sheet helper ----------
  const sheets = [];
  function openSheet(o) {
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<div class="sheet-backdrop" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><header class="sheet-head"><h2>${esc(o.title)}</h2><button class="icon-btn" data-close aria-label="Close">${ICON.x}</button></header><div class="sheet-body"></div><footer class="sheet-foot" hidden></footer></section>`;
    document.body.appendChild(wrap);
    document.documentElement.classList.add("sheet-open");
    const prevFocus = document.activeElement;
    const api = {
      wrap, body: $(".sheet-body", wrap), foot: $(".sheet-foot", wrap),
      close() {
        if (o.beforeClose && o.beforeClose() === false) return;
        wrap.remove(); const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1);
        if (!sheets.length) document.documentElement.classList.remove("sheet-open");
        if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
        if (o.onClose) o.onClose();
      },
      setTitle(t) { $(".sheet-head h2", wrap).textContent = t; }
    };
    $$("[data-close]", wrap).forEach((b) => { b.onclick = () => api.close(); });
    sheets.push(api);
    setTimeout(() => { const f = $(".sheet-head .icon-btn", wrap); if (!o.noAutoFocus && f) f.focus({ preventScroll: true }); }, 0);
    return api;
  }
  function closeAllSheets() { while (sheets.length) sheets[sheets.length - 1].close(); }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheets.length) { e.preventDefault(); sheets[sheets.length - 1].close(); }
  });

  // ---------- Toast & tooltip ----------
  let toastTimer = null;
  function toast(msg, action) {
    const t = $("#toast");
    t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`;
    t.hidden = false;
    if (action) $("button", t).onclick = () => { t.hidden = true; action.run(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, action ? 9000 : 3500);
  }
  const tipEl = () => $("#tip");
  let tipHideTimer = null;
  function showTip(target, x, y) {
    const text = target.getAttribute("data-tip");
    if (!text) return;
    const tip = tipEl();
    tip.textContent = text; tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let left = x + 12, top = y - r.height - 12;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 12;
    if (left < 8) left = 8;
    if (top < 8) top = y + 16;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hideTip() { const t = tipEl(); if (t) t.hidden = true; }
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (t) showTip(t, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("focusin", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); } else hideTip();
  });
  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch") return;
    const t = e.target.closest && e.target.closest("[data-tip]");
    clearTimeout(tipHideTimer);
    if (t && !t.matches("[data-act]")) { showTip(t, e.clientX, e.clientY); tipHideTimer = setTimeout(hideTip, 2200); } else hideTip();
  });
  window.addEventListener("scroll", hideTip, { passive: true });

  // ---------- Global actions ----------
  function go(tab) { S.tab = tab; saveUi(); hideTip(); render(); window.scrollTo({ top: 0 }); }
  const ACT = {
    tab: (el) => go(el.dataset.tab),
    settings: () => openSettings(),

  document.addEventListener("change", (e) => {

  document.addEventListener("visibilitychange", () => { if (!document.hidden && E.localToday() !== S.today) scheduleRender(); });

  // ---------- Add expenses ----------
  function openAdd(date) {
    if (S.mode !== "ready") { toast("Your ledger is still loading."); return; }
    const st = { date: date || S.today, text: store("draft") || "", overrides: {}, cad: {}, fx: {}, saving: false };
    const sh = openSheet({ title: "Add expenses", noAutoFocus: true, beforeClose: () => { store("draft", st.saving ? "" : st.text); return true; } });
    sh.body.innerHTML = `
      <div class="add-date"><button class="icon-btn" data-x="prev" aria-label="Day before">${ICON.left}</button>
        <label class="date-chip"><span data-x="datelabel"></span>${ICON.cal}<input type="date" id="add-date" aria-label="Date"></label>
        <button class="icon-btn" data-x="next" aria-label="Day after">${ICON.right}</button></div>
      <textarea class="textarea entry" id="add-text" rows="4" placeholder="25.99 chipotle&#10;17.85 x2 parking&#10;71.70 USD UPS package" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Expenses, one per line"></textarea>
      <p class="hint">One expense per line. Add <b>x2</b> for repeats, <b>USD</b> for US dollars, <b>yesterday</b> for the day before, and <b>but $10 was tide pens</b> to split one charge.</p>
      <ul class="pv" id="add-preview" aria-live="polite"></ul>`;
    sh.foot.hidden = false;
    sh.foot.innerHTML = `<div class="add-foot-total" id="add-total"></div><button class="btn primary" id="add-save" disabled>Add</button>`;
    const ta = $("#add-text", sh.body), dateIn = $("#add-date", sh.body);
    ta.value = st.text;
    const setDate = (d) => { st.date = d; dateIn.value = d; $("[data-x=datelabel]", sh.body).textContent = `${d === S.today ? "Today" : d === E.addDays(S.today, -1) ? "Yesterday" : E.DOW[E.dayIndex(d)]}, ${E.fmtMD(d)}`; refresh(); };
    $("[data-x=prev]", sh.body).onclick = () => setDate(E.addDays(st.date, -1));
    $("[data-x=next]", sh.body).onclick = () => setDate(E.addDays(st.date, 1));
    dateIn.onchange = () => { if (E.isDate(dateIn.value)) setDate(dateIn.value); };
    ta.oninput = () => { st.text = ta.value; refresh(); };
    ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); } };
    $("#add-save", sh.foot).onclick = save;
    let items = [];

    function build() {
      const parsed = E.parseEntry(st.text, { date: st.date, merchantIndex: S.mIndex, merchantGroups: S.settings.merchant_groups });
      const out = [];
      parsed.forEach((r) => {
        if (r.error) { out.push({ line: r.line, error: r.error }); return; }
        r.items.forEach((it) => {
          const ov = st.overrides[r.line] || {};
          const x = Object.assign({}, it, { line: r.line, issues: r.issues.slice() });
          if (ov.category) { x.category = ov.category; x.review = ""; x.picked = true; }
          if (ov.type !== undefined) { x.type = ov.type; if (!ov.category) x.category = TYPE_CATEGORY[ov.type] || x.category; x.review = ""; x.picked = true; }
          if (x.currency === "USD") {
            const f = st.fx[x.date];
            const manual = st.cad[r.line + "|" + x.date];
            if (manual !== undefined && manual !== null) {
              x.amount_cents = x.original_cents < 0 ? -Math.abs(manual) : manual;
              x.fx = { rate: E.impliedRate(x.amount_cents, x.original_cents), date: x.date, source: "Bank charge", provisional: false };
            } else if (f && f.rate) {
              x.amount_cents = E.convertCents(x.original_cents, f.rate);
              x.fx = { rate: f.rate, date: f.date, source: f.source || "Bank of Canada", provisional: !!f.provisional, estimate: !!f.estimate };
              if (f.estimate) x.review = x.review || "fx";
            } else x.amount_cents = null;
            if (x.amount_cents !== null && x.splits.length) x.splits = E.scaleSplits(x.splits, x.original_cents, x.amount_cents);
          }
          out.push(x);
        });
      });
      return out;
    }
    function needRates() {
      for (const it of items) {
        if (it.error || it.currency !== "USD" || st.fx[it.date]) continue;
        st.fx[it.date] = { status: "loading" };
        rateFor(it.date).then((r) => {
          st.fx[it.date] = r && !r.missing ? Object.assign({ status: "ok" }, r) : { status: "missing", error: r && r.error };

      }
    }
    function refresh() {
      items = build();
      needRates();
      const pv = $("#add-preview", sh.body);
      const catSel = (it) => `<option value="" disabled ${it.review === "category" ? "selected" : ""}>Pick a category</option>` + E.CATEGORIES.map((c) => `<option ${it.review !== "category" && it.category === c ? "selected" : ""}>${esc(c)}</option>`).join("");
      const typeSel = (it) => `<option value="" ${!it.type ? "selected" : ""} disabled>What was it?</option>` + E.TYPES.map((t) => `<option ${it.type === t ? "selected" : ""}>${esc(t)}</option>`).join("");
      pv.innerHTML = items.map((it, i) => {
        if (it.error) return `<li class="pv-item bad"><div class="pv-top"><span class="pv-name">${esc(it.line)}</span></div><span class="err">${esc(it.error)}. Start the line with the amount, like 25.99 chipotle.</span></li>`;
        const isGroup = !!E.isGroupMerchant(it.merchant, S.settings);
        const f = it.currency === "USD" ? st.fx[it.date] : null;
        let amt;
        if (it.currency === "USD") {
          if (it.amount_cents !== null) amt = `${fmt(it.amount_cents)}<small>${usd(it.original_cents)} · ${esc(fxLabel(it.fx))}</small>`;
          else if (f && f.status === "loading") amt = `<small>Getting rate…</small>${usd(it.original_cents)}`;
          else amt = `${usd(it.original_cents)}<small>Enter CAD below</small>`;
        } else amt = fmt(it.amount_cents);
        const flagged = it.review === "category" || (isGroup && !it.type && !it.splits.length);
        const ask = isGroup && !it.splits.length
          ? `<label class="chip-select ${flagged ? "ask" : ""}"><span>${esc(it.type || "What was it?")}</span><select data-i="${i}" data-k="type" aria-label="Item type">${typeSel(it)}</select></label>`
          : "";
        const cat = it.splits.length ? `<span class="chip">${ICON.split.replace('class="i"', 'class="i" style="width:14px;height:14px;margin-right:4px"')}Split</span>`
          : `<label class="chip-select ${it.review === "category" && !isGroup ? "ask" : ""}"><span>${esc(it.review === "category" ? "Pick a category" : it.category)}</span><select data-i="${i}" data-k="category" aria-label="Category">${catSel(it)}</select></label>`;
        const splits = it.splits.length ? `<div class="pv-splits">${it.splits.map((s) => `<div><span>${esc(s.type || s.category)}${s.note && s.note !== s.type ? " · " + esc(s.note) : ""}</span><span class="num">${it.currency === "USD" && it.amount_cents === null ? usd(s.amount_cents) : fmt(s.amount_cents)}</span></div>`).join("")}</div>` : "";
        const dateNote = it.date !== st.date ? ` · ${esc(E.fmtDay(it.date))}` : "";
        const issues = it.issues.filter((x) => !/Pick a category|What was this/.test(x));
        const cadInput = it.currency === "USD" && (it.amount_cents === null || (f && f.estimate) || st.cad[it.line + "|" + it.date] !== undefined)
          ? `<label class="field"><span>CAD charged${f && f.error ? ` (${esc(f.error)})` : ""}</span><input class="input" inputmode="decimal" data-i="${i}" data-k="cad" placeholder="${it.amount_cents !== null ? E.centsToDecimal(it.amount_cents) : "0.00"}" value="${st.cad[it.line + "|" + it.date] !== undefined ? E.centsToDecimal(st.cad[it.line + "|" + it.date]) : ""}"></label>` : "";
        return `<li class="pv-item ${flagged ? "flagged" : ""}"><div class="pv-top"><span class="pv-name">${esc(it.merchant)}${it.description ? `<small>${esc(it.description)}</small>` : ""}${it.qty > 1 ? `<small>${it.qty_index} of ${it.qty}</small>` : ""}</span><span class="pv-amt">${amt}</span></div>
          <div class="pv-meta">${ask}${cat}${dateNote ? `<span class="chip">${dateNote.slice(3)}</span>` : ""}${it.currency === "USD" && it.fx && it.fx.provisional ? `<span class="chip" data-tip="Today's Bank of Canada rate is published around 4:30 PM ET. You can recalculate it later from the expense.">Provisional rate</span>` : ""}</div>
          ${splits}${issues.map((x) => `<span class="flag">${esc(x)}</span>`).join("")}${cadInput}</li>`;
      }).join("");
      $$("select[data-i]", pv).forEach((s) => {
        s.onchange = () => {
          const it = items[Number(s.dataset.i)];
          const ov = st.overrides[it.line] = st.overrides[it.line] || {};
          if (s.dataset.k === "category") ov.category = s.value; else ov.type = s.value;
          refresh();
        };
      });
      $$("input[data-k=cad]", pv).forEach((inp) => {
        inp.onchange = () => {
          const it = items[Number(inp.dataset.i)];
          const c = E.parseMoney(inp.value);
          if (c === null || inp.value.trim() === "") delete st.cad[it.line + "|" + it.date]; else st.cad[it.line + "|" + it.date] = Math.abs(c);
          refresh();
        };
      });
      const good = items.filter((x) => !x.error);
      const blocked = good.some((x) => x.amount_cents === null);
      const total = good.reduce((s, x) => s + (x.amount_cents || 0), 0);
      const needCat = good.filter((x) => x.review === "category" || (E.isGroupMerchant(x.merchant, S.settings) && !x.type && !x.splits.length)).length;
      $("#add-total", sh.foot).innerHTML = good.length ? `<strong>${fmt(total)}</strong>${plural(good.length, "expense")}${needCat ? ` · ${needCat} unsorted` : ""}${items.some((x) => x.error) ? " · some lines skipped" : ""}` : `<span class="muted">Type an expense to start</span>`;

    }
    async function save() {
      const good = items.filter((x) => !x.error);
      if (!good.length || good.some((x) => x.amount_cents === null) || st.saving) return;

      const now = nowISO();
      const txns = good.map((x, i) => {
        const isGroup = !!E.isGroupMerchant(x.merchant, S.settings);
        let review = x.review || "";
        if (isGroup && !x.type && !x.splits.length) review = "category";

          id: E.newId(x.date), date: x.date, merchant: x.merchant, description: x.description || "",

        };

        if (!x.picked && known && known.category === t.category) return;
        if (!x.picked && x.issues.length) return;

      toast(`Added ${plural(txns.length, "expense")} · ${fmt(total)}`, { label: "Undo", run: () => { deleteTxns(txns, "undo").then(() => toast("Removed")).catch((e) => toast(writeError(e))); } });
    }
    setDate(st.date);
    setTimeout(() => { ta.focus(); const n = ta.value.length; try { ta.setSelectionRange(n, n); } catch (e) { /* ignore */ } }, 30);
  }

  // ---------- Edit an expense ----------
  function openEditor(orig) {
    const t = clone(orig);
    const st = { splits: (t.splits || []).map((s) => Object.assign({}, s, { amt: E.centsToDecimal(s.amount_cents) })), confirmDelete: false, saving: false, fxNew: null, histOpen: false };
    const sh = openSheet({ title: `${t.merchant} · ${fmt(t.amount_cents)}`, noAutoFocus: true });

    const merchantNames = Array.from(new Set(Array.from(S.mIndex.values()).map((m) => m.name))).sort();

      <div class="amount-row"><label class="field"><span id="ed-amt-label">Amount</span><input class="input" id="ed-amt" inputmode="decimal" autocomplete="off"></label>
        <label class="field"><span>Currency</span><select class="select" id="ed-cur"><option>CAD</option><option>USD</option></select></label></div>

      <div class="grid2"><label class="field"><span>Date</span><input class="input" type="date" id="ed-date"></label>

      <label class="field"><span>Description</span><input class="input" id="ed-desc" autocomplete="off" placeholder="What was it?"></label>
      <div id="ed-catblock"></div>
      <div><button class="btn sm" id="ed-split-toggle">${ICON.split}<span></span></button></div>
      <div id="ed-splits" hidden></div>
      <label class="field"><span>Notes</span><textarea class="textarea" id="ed-notes" rows="2"></textarea></label>
      <p class="note" id="ed-meta"></p>
      <div id="ed-history"></div>`;
    sh.foot.hidden = false;
    const amt = $("#ed-amt", sh.body), cur = $("#ed-cur", sh.body), dateIn = $("#ed-date", sh.body), mer = $("#ed-merchant", sh.body), desc = $("#ed-desc", sh.body), notes = $("#ed-notes", sh.body);
    cur.value = t.currency || "CAD";
    amt.value = E.centsToDecimal(t.currency === "USD" ? t.original_cents : t.amount_cents);
    dateIn.value = t.date; mer.value = t.merchant; desc.value = t.description || ""; notes.value = t.notes || "";
    st.bank = t.currency === "USD" && t.fx && t.fx.source === "Bank charge" ? E.centsToDecimal(t.amount_cents) : "";

      if (st.bank && bank !== null) return a < 0 ? -Math.abs(bank) : Math.abs(bank);
      if (st.fx && st.fx.rate && st.fx.source !== "Bank charge") return E.convertCents(a, st.fx.rate);
      return null;
    }
    function drawFx() {
      const box = $("#ed-fx", sh.body);

      if (cur.value !== "USD") { box.hidden = true; return; }
      box.hidden = false;
      const c = cadAmount();
      const f = st.fx && st.fx.source !== "Bank charge" ? st.fx : null;
      box.innerHTML = `<div class="fxline"><span>${f ? `${esc(f.source || "Bank of Canada")} rate <strong class="num">${esc(f.rate)}</strong> · ${esc(E.fmtDay(f.date))}${f.provisional ? " (provisional)" : ""}${f.estimate ? " (estimate)" : ""}` : st.loadingFx ? "Getting the Bank of Canada rate…" : "No Bank of Canada rate yet"}</span><button class="btn sm" id="ed-recalc">${f ? "Recalculate" : "Get rate"}</button></div>
        <label class="field"><span>CAD your bank charged (optional, overrides the rate)</span><input class="input" id="ed-bank" inputmode="decimal" value="${esc(st.bank)}" placeholder="${c !== null && !st.bank ? E.centsToDecimal(c) : ""}"></label>
        <div class="fxline"><span>Counts toward your budget</span><strong class="num">${c === null ? "—" : fmt(c)}</strong></div>
        ${st.fxMsg ? `<span class="note">${esc(st.fxMsg)}</span>` : ""}`;
      $("#ed-bank", sh.body).oninput = (e) => { st.bank = e.target.value; drawCad(); };
      $("#ed-recalc", sh.body).onclick = async () => {

      $("#ed-cat", sh.body).onchange = (e) => { st.category = e.target.value; drawCat(); };
      $("#ed-type", sh.body).oninput = (e) => { st.type = e.target.value; };
      const rem = $("#ed-remember", sh.body); if (rem) rem.onchange = (e) => { st.remember = e.target.checked; };
    }
    function drawSplitStatus() {
      const el = $("#ed-split-status", sh.body);
      if (!el) return;
      const total = cadAmount();
      const parts = st.splits.map((s) => E.parseMoney(s.amt));
      const sum = parts.reduce((a, c) => a + (c === null ? 0 : c), 0);
      if (total === null) { el.textContent = ""; return; }
      const left = total - sum;
      el.className = "split-status " + (left === 0 && parts.every((p) => p !== null) ? "good-t" : "warn-t");
      el.textContent = left === 0 ? `Parts add up to ${fmt(total)}` : left > 0 ? `${fmt(left)} left to assign` : `Parts are ${fmt(-left)} over the total`;
    }
    function drawSplits() {
      const box = $("#ed-splits", sh.body);
      const tog = $("#ed-split-toggle span", sh.body);
      tog.textContent = st.splits.length ? "Remove split" : "Split into parts";
      if (!st.splits.length) { box.hidden = true; box.innerHTML = ""; drawCat(); return; }
      box.hidden = false;
      box.innerHTML = `<div class="section-title" style="margin-bottom:8px">Parts${cur.value === "USD" ? " (in CAD)" : ""}</div><div class="split-rows">${st.splits.map((s, i) => `
        <div class="split-row"><select class="select" data-s="${i}" data-f="category" aria-label="Part category">${catOpts(s.category)}</select>
          <input class="input num" data-s="${i}" data-f="amt" inputmode="decimal" value="${esc(s.amt)}" aria-label="Part amount">
          <button class="icon-btn" data-s="${i}" data-f="del" aria-label="Remove part">${ICON.x}</button>
          <div class="two"><input class="input" data-s="${i}" data-f="type" list="ed-tlist2" placeholder="Item type" value="${esc(s.type || "")}" aria-label="Part item type"><input class="input" data-s="${i}" data-f="note" placeholder="Note" value="${esc(s.note || "")}" aria-label="Part note"></div></div>`).join("")}</div>
        <datalist id="ed-tlist2">${E.TYPES.map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-f="addpart">${ICON.plus}Add part</button><span class="grow"></span><span id="ed-split-status"></span></div>`;
      $$("[data-s]", box).forEach((el) => {
        const i = Number(el.dataset.s), f = el.dataset.f;
        if (f === "del") el.onclick = () => { st.splits.splice(i, 1); if (st.splits.length === 1) st.splits = []; drawSplits(); };
        else el.oninput = el.onchange = () => { st.splits[i][f] = el.value; if (f === "amt") drawSplitStatus(); };
      });
      $("[data-f=addpart]", box).onclick = () => {
        const total = cadAmount() || 0;
        const sum = st.splits.reduce((a, s) => a + (E.parseMoney(s.amt) || 0), 0);
        st.splits.push({ category: st.category || "Miscellaneous", type: "", note: "", amt: E.centsToDecimal(Math.max(0, total - sum)) });
        drawSplits();
      };
      drawSplitStatus();
      $("#ed-catblock", sh.body).innerHTML = "";
    }
    $("#ed-split-toggle", sh.body).onclick = () => {
      if (st.splits.length) st.splits = [];
      else {
        const total = cadAmount() || 0;
        st.splits = [{ category: st.category, type: st.type, note: "", amt: E.centsToDecimal(total) }, { category: st.category, type: "", note: "", amt: "0.00" }];
      }
      drawSplits();
    };
    cur.onchange = async () => {
      if (cur.value === "USD" && (!st.fx || st.fx.source === "Bank charge")) {
        st.loadingFx = true; drawFx();
        const r = await rateFor(dateIn.value).catch(() => null);
        st.loadingFx = false;
        if (r && !r.missing) st.fx = { rate: r.rate, date: r.date, source: r.source || "Bank of Canada", provisional: !!r.provisional, estimate: !!r.estimate };
        else st.fxMsg = (r && r.error) || "No rate found. Enter the CAD your bank charged.";
      }
      drawFx(); drawSplitStatus();
    };
    amt.oninput = () => { drawCad(); };
    mer.oninput = () => { if (!st.splits.length) drawCat(); };
    dateIn.onchange = () => {
      if (cur.value === "USD" && st.fx && st.fx.date && E.isDate(dateIn.value) && dateIn.value !== t.date && st.fx.source !== "Bank charge") {
        st.fxMsg = "The date changed. Recalculate to use that day's rate.";
        drawFx();
      }
    };

    // Meta + history
    const meta = [];
    if (orig.created_at) meta.push(`Added ${fmtTime(orig.created_at)}`);
    if (orig.rev > 1) meta.push(`edited ${plural(orig.rev - 1, "time")}`);
    if (orig.source && orig.source !== "app") meta.push(`from ${orig.source.replace(/^import:/, "import ")}`);
    $("#ed-meta", sh.body).innerHTML = `${esc(meta.join(" · "))}${orig.rev > 1 || orig.source !== "app" ? ` · <button class="link" id="ed-hist">History</button>` : ""}`;
    const histBtn = $("#ed-hist", sh.body);
    if (histBtn) histBtn.onclick = async () => {
      const box = $("#ed-history", sh.body);
      box.innerHTML = `<p class="note">Loading history…</p>`;
      try {
        const s = await S.cap.db.doc("history/" + orig.id).get();
        const entries = (s.exists && s.data().entries) || [];
        if (!entries.length) { box.innerHTML = `<p class="note">No earlier versions.</p>`; return; }
        const rows = entries.map((en, i) => {
          const after = (entries.slice(i + 1).find((x) => x.before) || {}).before || orig;
          const changes = en.before ? diffList(en.before, after) : [];
          const label = en.action === "edit" ? "Edited" : en.action === "delete" ? "Deleted" : en.action === "undo" ? "Undone" : en.action === "restore" ? "Restored" : en.action;
          return `<li><span class="when">${esc(label)} · ${esc(fmtTime(en.at))}</span>${changes.length ? `<br><span class="chg">${changes.map(esc).join("<br>")}</span>` : ""}</li>`;
        }).reverse();
        box.innerHTML = `<div class="section-title" style="margin-bottom:8px">History</div><ul class="history">${rows.join("")}</ul>`;
      } catch (e) { box.innerHTML = `<p class="note">Couldn't load history.</p>`; }
    };

    function footer() {
      if (st.confirmDelete) {
        sh.foot.innerHTML = `<span class="grow">Delete this expense?</span><button class="btn" data-f="keep">Keep</button><button class="btn danger solid" data-f="del">Delete</button>`;
        $("[data-f=keep]", sh.foot).onclick = () => { st.confirmDelete = false; footer(); };
        $("[data-f=del]", sh.foot).onclick = async () => {
          sh.close();
          try { await deleteTxns([orig]); toast(`Deleted ${orig.merchant} · ${fmt(orig.amount_cents)}`, { label: "Undo", run: () => restoreTxn(orig).then(() => toast("Restored")).catch((e) => toast(writeError(e))) }); }
          catch (e) { toast(writeError(e)); }
        };
        return;
      }
      sh.foot.innerHTML = `<button class="btn danger" data-f="ask">Delete</button><span class="grow err" id="ed-err"></span><button class="btn primary" data-f="save">Save</button>`;
      $("[data-f=ask]", sh.foot).onclick = () => { st.confirmDelete = true; footer(); };
      $("[data-f=save]", sh.foot).onclick = save;
    }
    async function save() {
      const err = $("#ed-err", sh.foot);
      const a = E.parseMoney(amt.value);
      const cad = cadAmount();
      if (a === null) { err.textContent = "Enter an amount like 25.99."; return; }
      if (cad === null) { err.textContent = "Get the rate or enter the CAD your bank charged."; return; }
      const next = Object.assign({}, orig, {
        date: dateIn.value, merchant: mer.value.trim(), description: desc.value.trim(), notes: notes.value.trim(),
        currency: cur.value, amount_cents: cad, original_cents: cur.value === "USD" ? a : cad,
        category: st.category, type: (st.type || "").trim(), review: "", rev: (orig.rev || 1) + 1, updated_at: nowISO()
      });
      if (cur.value === "USD") {
        const bank = E.parseMoney(st.bank);
        next.fx = st.bank && bank !== null ? { rate: E.impliedRate(cad, a), date: dateIn.value, source: "Bank charge", provisional: false, boc_rate: st.fx && st.fx.source !== "Bank charge" ? st.fx.rate : null } : Object.assign({}, st.fx);
      } else next.fx = null;
      if (st.splits.length) {
        next.splits = st.splits.map((s) => ({ category: s.category, type: (s.type || "").trim(), note: (s.note || "").trim(), amount_cents: E.parseMoney(s.amt) }));
        const largest = next.splits.slice().sort((x, y) => (y.amount_cents || 0) - (x.amount_cents || 0))[0];
        next.category = largest.category; next.type = largest.type;
      } else next.splits = [];
      const errs = E.validateTxn(next);
      if (errs.length) { err.textContent = errs[0]; return; }
      const same = JSON.stringify(Object.assign({}, orig, { rev: 0, updated_at: "" })) === JSON.stringify(Object.assign({}, next, { rev: 0, updated_at: "", review: orig.review }));
      if (same && !orig.review) { sh.close(); return; }
      sh.close();
      try {
        await updateTxn(orig, next);
        const rem = !next.splits.length && st.remember && !E.isGroupMerchant(next.merchant, S.settings);
        const known = S.mIndex.get(E.norm(next.merchant));
        if (rem && (!known || known.category !== next.category)) await learnMerchants({ [E.norm(next.merchant)]: { name: next.merchant, category: next.category, type: next.type } });
        toast("Saved");
      } catch (e) { toast(writeError(e)); }
    }
    drawFx(); drawSplits(); footer();
    if (!st.splits.length) drawCat();
  }
  const DIFF_FIELDS = [
    ["date", "Date", (v) => (E.isDate(v) ? E.fmtDay(v) : v)], ["merchant", "Merchant"], ["description", "Description"], ["amount_cents", "Amount", (v) => fmt(v)],
    ["currency", "Currency"], ["category", "Category"], ["type", "Item type"], ["notes", "Notes"],
    ["splits", "Split", (v) => (v && v.length ? v.map((s) => `${s.type || s.category} ${fmt(s.amount_cents)}`).join(", ") : "none")],
    ["fx", "Rate", (v) => (v ? `${v.rate} (${v.source})` : "none")]
  ];
  function diffList(a, b) {
    const out = [];
    for (const [k, label, f] of DIFF_FIELDS) {
      const va = JSON.stringify(a[k] === undefined ? null : a[k]), vb = JSON.stringify(b[k] === undefined ? null : b[k]);
      if (va !== vb) { const show = (v) => (f ? f(v) : v === "" || v === null || v === undefined ? "blank" : String(v)); out.push(`${label}: ${show(a[k])} → ${show(b[k])}`); }
    }
    return out;
  }

  // ---------- Settings ----------

      const current = E.weeklyBudget(E.weekStart(S.today), S.settings);

      const learnedN = Object.keys(S.learned).length;
      sh.body.innerHTML = `
        <div class="section-title">Weekly budget</div>
        <div class="card" style="display:grid;gap:12px">
          <div class="row"><span class="grow">Current budget</span><strong class="num">${fmt(current)} a week</strong></div>
          <div class="grid2"><label class="field"><span>New weekly budget</span><input class="input" id="st-budget" inputmode="decimal" placeholder="${E.centsToDecimal(current)}"></label>

        </div>

          <div class="row wrap">${S.settings.merchant_groups.map((g, i) => `<span class="chip" style="height:30px;padding-right:2px">${esc(g)}<button class="icon-btn" style="width:26px;height:26px" data-g="${i}" aria-label="Remove ${esc(g)}">${ICON.x}</button></span>`).join("") || `<span class="note">None</span>`}</div>

        </div>

        <div class="card" style="display:grid;gap:8px">
          <button class="btn block" id="st-merchants">Merchant categories (${learnedN} learned)</button>
          <button class="btn block" id="st-deleted">Recently deleted</button>
          <button class="btn block" id="st-csv">${ICON.download}Export all transactions (CSV)</button>
          <button class="btn block" id="st-json">${ICON.download}Download a full backup (JSON)</button>
          <label class="btn block" style="position:relative">Restore from a backup<input type="file" id="st-restore" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Choose a backup file"></label>
          <div id="st-restore-box"></div>
          <p class="note" style="margin:0">${plural(S.txns.length, "expense")} saved${S.txns.length ? ` since ${esc(E.fmtDay(S.txns[0].date))}` : ""}${window.ALLOWANCE_STANDALONE ? " on this phone only" : ""}. Last backup: ${S.lastBackup ? esc(fmtTime(S.lastBackup)) : "never"}.</p>
        </div>
        <div class="section-title">How the numbers work</div>
        <div class="card note" style="display:grid;gap:8px;color:var(--ink-2)">
          <p style="margin:0">Weeks run Monday to Sunday. Each week starts fresh: leftover money doesn't carry over and overspending doesn't shrink the next week.</p>
          <p style="margin:0"><strong>Per day left</strong> divides what's left by the days still to come. If the selected day has no spending yet, it counts as one of those days. Once it has spending, only the days after it count. On Sunday you see what's left, and over budget you see the overspend.</p>
          <p style="margin:0">US dollar expenses use the Bank of Canada daily rate for that date (the previous business day's rate on weekends and holidays). You can replace it with what your bank actually charged. Saved rates never change unless you recalculate.</p>

      $("#st-budget-save", sh.body).onclick = async () => {

        const name = known ? known.name : E.titleCase(v);
        if (S.settings.merchant_groups.some((g) => E.norm(g) === E.norm(name))) return;
        try { await saveSettings(Object.assign({}, S.settings, { merchant_groups: S.settings.merchant_groups.concat([name]) })); } catch (e) { toast(writeError(e)); }
        setTimeout(draw, 300);
      };
      $("#st-merchants", sh.body).onclick = openMerchants;
      $("#st-deleted", sh.body).onclick = openDeleted;
      $("#st-csv", sh.body).onclick = () => exportCSV(S.txns, "all");
      $("#st-json", sh.body).onclick = () => { exportBackup().then(() => setTimeout(draw, 300)); };

        $("[data-x=no]", box).onclick = () => { box.innerHTML = ""; e.target.value = ""; };

          ev.target.disabled = true; ev.target.textContent = "Restoring…";
          try { await applyBackup(r); toast(`Restored ${plural(r.fresh.length, "expense")}`); setTimeout(draw, 400); }
          catch (err) { toast(writeError(err)); ev.target.disabled = false; ev.target.textContent = "Restore"; }

    draw();
  }
  function openMerchants() {

      $$("[data-del]", list).forEach((b) => { b.onclick = async () => { try { await learnMerchants({ [b.dataset.del]: null }); setTimeout(draw, 300); } catch (e) { toast(writeError(e)); } }; });

  async function openDeleted() {

      const snap = await S.cap.db.collection("history").where("deleted", "==", true).limit(200).get();
      const rows = snap.docs.map((d) => d.data()).filter((h) => h && h.entries && h.entries.length).map((h) => {
        const last = h.entries.slice().reverse().find((e) => e.before);
        return last ? { t: last.before, at: h.deleted_at || last.at } : null;
      }).filter(Boolean).sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 60);
      if (!rows.length) { sh.body.innerHTML = `<div class="empty"><strong>Nothing deleted</strong>Deleted expenses show up here so you can restore them.</div>`; return; }
      sh.body.innerHTML = rows.map((r, i) => `<div class="listrow" style="cursor:default"><span class="lr-main"><span class="lr-title">${esc(r.t.merchant)} · ${fmt(r.t.amount_cents)}</span><br><span class="lr-sub">${esc(E.fmtDay(r.t.date))} · deleted ${esc(fmtTime(r.at))}</span></span><button class="btn sm" data-r="${i}">Restore</button></div>`).join("");
      $$("[data-r]", sh.body).forEach((b) => {

        };

  // ---------- Exports ----------
  async function saveFile(filename, data) {
    const dl = S.cap.downloads;
    if (!dl) { toast("Downloads aren't available in this view."); return false; }
    try { await dl.save({ filename, data }); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === "declined") return false;
      toast(c === "rate_limited" ? "A download is already waiting for you to confirm." : "Couldn't export the file here.");
      return false;
    }
  }
  function exportCSV(list, label) { saveFile(`spend-tracker-${label}-${S.today}.csv`, E.toCSV(list)); }
  async function exportBackup() {
    const data = JSON.stringify({ app: "Spend Tracker", version: 1, exported_at: nowISO(), settings: S.settings, merchants: S.learned, transactions: S.txns }, null, 2);
    const ok = await saveFile(`spend-tracker-backup-${S.today}.json`, data);
    if (ok) {
      try { await S.cap.db.doc("meta/backup").set({ last: nowISO(), count: S.txns.length }); } catch (e) { /* not critical */ }
      toast(`Backup saved · ${plural(S.txns.length, "expense")}`);
    }
  }
  // Restore: adds expenses from a backup file that aren't already here (matched by id), never duplicates.
  async function readBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { return { error: "That file isn't a Spend Tracker backup." }; }
    if (!data || !Array.isArray(data.transactions)) return { error: "That file isn't a Spend Tracker backup." };
    const have = new Set(S.txns.map((t) => t.id));
    const valid = data.transactions.filter((t) => t && typeof t.id === "string" && /^[A-Za-z0-9_.:-]{1,80}$/.test(t.id) && !E.validateTxn(t).length);
    const fresh = valid.filter((t) => !have.has(t.id));
    return { data, fresh, already: valid.length - fresh.length, invalid: data.transactions.length - valid.length };
  }
  async function applyBackup(r) {
    await addTxns(r.fresh.map((t) => Object.assign({}, t, { source: t.source || "backup" })));
    const s = r.data.settings;
    if (s && Array.isArray(s.budgets)) {
      const budgets = S.settings.budgets.slice();
      for (const b of s.budgets) if (b && E.isDate(b.from) && Number.isSafeInteger(b.weekly_cents) && b.weekly_cents > 0 && !budgets.some((x) => x.from === b.from)) budgets.push({ from: b.from, weekly_cents: b.weekly_cents });
      const groups = S.settings.merchant_groups.slice();
      for (const g of Array.isArray(s.merchant_groups) ? s.merchant_groups : []) if (typeof g === "string" && g.trim() && !groups.some((x) => E.norm(x) === E.norm(g))) groups.push(g);
      await saveSettings({ budgets, merchant_groups: groups });
    }
    const m = r.data.merchants;
    if (m && typeof m === "object") {
      await enqueue("meta:merchants", async () => {
        const ref = S.cap.db.doc("meta/merchants");
        const snap = await retry(() => ref.get());
        const map = Object.assign({}, (snap.exists && snap.data().map) || {});
        for (const [k, v] of Object.entries(m)) if (!map[k] && v && v.name && E.CATEGORIES.includes(v.category)) map[k] = { name: v.name, category: v.category, type: v.type || "", n: v.n || 1, last: v.last || S.today };
        await retry(() => ref.set({ map, updated_at: nowISO() }));
      });
    }
  }

  boot();
})();

</script>
