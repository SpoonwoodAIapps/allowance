<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spend Tracker</title>
<meta name="description" content="Personal spending tracker with a weekly budget. Expenses stay on this device.">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spend Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one column on phones with bottom tabs and a floating Add button; from 960px a side rail and a two-column dashboard. */
:root {
  --bg: #ECEFF4;
  --surface: #FFFFFF;
  --surface-2: #F4F6F9;
  --ink: #121826;
  --ink-2: #485266;
  --muted: #7B8497;
  --line: #E0E4EB;
  --line-strong: #CBD1DC;
  --accent: #3347D1;
  --accent-2: #2536A8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5E8FA;
  --hero: #141A2C;
  --hero-ink: #F3F5FB;
  --hero-2: #A6AEC4;
  --hero-track: #283049;
  --hero-gap: #141A2C;
  --hero-line: #323B57;
  --good: #1E9E5A;
  --warn: #E2A300;
  --bad: #D9443F;
  --good-ink: #0F7A42;
  --warn-ink: #8A6100;
  --bad-ink: #B42F2A;
  --good-hero: #45D487;
  --warn-hero: #FFC53D;
  --bad-hero: #FF6E66;
  --heat-0: #F2F4F8;
  --heat-1: #DDE3FA;
  --heat-2: #B6C1F4;
  --heat-3: #8394EA;
  --heat-4: #4558D5;
  --heat-ink-strong: #FFFFFF;
  --scrim: rgba(12, 16, 28, 0.42);
  --shadow-pop: 0 10px 30px rgba(18, 24, 38, 0.16), 0 2px 6px rgba(18, 24, 38, 0.08);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0E17; --surface: #121826; --surface-2: #181F2F; --ink: #E8EBF3; --ink-2: #AEB6C8; --muted: #7C859A;
    --line: #232A3A; --line-strong: #323A4D; --accent: #8D9CFF; --accent-2: #AAB5FF; --accent-ink: #0A0E17; --accent-soft: #1E2547;
    --hero: #1A2133; --hero-ink: #F3F5FB; --hero-2: #A6AEC4; --hero-track: #2B3450; --hero-gap: #1A2133; --hero-line: #343E5C;
    --good: #2FBF71; --warn: #F0B127; --bad: #F05F59; --good-ink: #5BD995; --warn-ink: #F5C04A; --bad-ink: #FF8A84;
    --good-hero: #45D487; --warn-hero: #FFC53D; --bad-hero: #FF6E66;
    --heat-0: #161C2A; --heat-1: #222B4E; --heat-2: #2F3C80; --heat-3: #4657B8; --heat-4: #7184F0; --heat-ink-strong: #0A0E17;
    --scrim: rgba(0, 0, 0, 0.6); --shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0E17; --surface: #121826; --surface-2: #181F2F; --ink: #E8EBF3; --ink-2: #AEB6C8; --muted: #7C859A;
  --line: #232A3A; --line-strong: #323A4D; --accent: #8D9CFF; --accent-2: #AAB5FF; --accent-ink: #0A0E17; --accent-soft: #1E2547;
  --hero: #1A2133; --hero-ink: #F3F5FB; --hero-2: #A6AEC4; --hero-track: #2B3450; --hero-gap: #1A2133; --hero-line: #343E5C;
  --good: #2FBF71; --warn: #F0B127; --bad: #F05F59; --good-ink: #5BD995; --warn-ink: #F5C04A; --bad-ink: #FF8A84;
  --good-hero: #45D487; --warn-hero: #FFC53D; --bad-hero: #FF6E66;
  --heat-0: #161C2A; --heat-1: #222B4E; --heat-2: #2F3C80; --heat-3: #4657B8; --heat-4: #7184F0; --heat-ink-strong: #0A0E17;
  --scrim: rgba(0, 0, 0, 0.6); --shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- App frame ---------- */
.app { min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; margin: 0; line-height: 1; display: flex; align-items: baseline; gap: 8px; }
.wordmark small { font-family: var(--font-ui); font-weight: 500; font-size: 13px; letter-spacing: 0; color: var(--muted); }
.topbar .spacer { flex: 1; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(var(--tabbar-h) + 32px); max-width: 1180px; margin: 0 auto; }
.view-title { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; margin: 6px 0 14px; text-wrap: balance; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tabbar-h); background: none; border: 0; color: var(--muted); font-size: 11.5px; font-weight: 500; min-width: 0; }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-add-slot { display: grid; place-items: center; height: var(--tabbar-h); }
.tab-add {
  width: 56px; height: 48px; border-radius: 16px; border: 0;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
}
.tab-add svg.i { width: 26px; height: 26px; stroke-width: 2.3; }
.tab-add:active { transform: scale(0.96); }
.rail { display: none; }

@media (min-width: 960px) {
  .tabbar { display: none; }
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); }
  .rail .wordmark { padding: 6px 10px 18px; }
  .rail .tab { flex-direction: row; justify-content: flex-start; gap: 10px; height: 42px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: var(--ink-2); }
  .rail .tab:hover { background: var(--surface-2); }
  .rail .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent-2); }
  .rail .add-btn { margin: 0 0 14px; justify-content: center; }
  .rail .rail-foot { margin-top: auto; }
  .topbar { display: none; }
  .app-main { min-width: 0; }
  .view { padding-block: 24px 48px; }
}

/* ---------- Generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.card + .card, .stack > * + * { margin-top: 12px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.card-head h2, .card-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 0 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad-ink); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.pill svg.i { width: 16px; height: 16px; stroke-width: 2.2; }
.pill.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.pill.close { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn-ink); }
.pill.over { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad-ink); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }

.field { display: grid; gap: 6px; }
.field > span, .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px;
}
.textarea { min-height: 80px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); outline-offset: 0; }
.select { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 9px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.note { font-size: 13px; color: var(--muted); }
.flag { display: inline-flex; align-items: center; gap: 6px; color: var(--warn-ink); font-size: 13px; font-weight: 500; }
.flag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.err { color: var(--bad-ink); font-size: 13px; font-weight: 500; }

/* ---------- Dashboard ---------- */
.dash { display: grid; gap: 12px; }
@media (min-width: 960px) { .dash { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 16px; } .dash .col { display: grid; gap: 16px; } .dash .col > * + * { margin-top: 0; } }
.weeknav { display: flex; align-items: center; gap: 4px; margin: 2px 0 10px; }
.weeknav .wk { font-weight: 600; font-size: 15px; padding: 0 6px; }
.weeknav .wk small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 20px 18px 18px; border: 1px solid var(--hero-line); }
.hero .eyebrow { color: var(--hero-2); }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.hero-amt { font-size: 48px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 2px; }
.hero-of { color: var(--hero-2); font-size: 15px; }
.hero .pill.ok { background: color-mix(in srgb, var(--good-hero) 16%, transparent); color: var(--good-hero); }
.hero .pill.close { background: color-mix(in srgb, var(--warn-hero) 16%, transparent); color: var(--warn-hero); }
.hero .pill.over { background: color-mix(in srgb, var(--bad-hero) 16%, transparent); color: var(--bad-hero); }
.hero .pill.plain { background: color-mix(in srgb, var(--hero-ink) 10%, transparent); color: var(--hero-ink); }
.meter { position: relative; margin: 18px 0 8px; }
.meter-track { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--hero-track); }
.meter-seg { height: 100%; flex: none; }
.meter-seg.ok { background: var(--good-hero); } .meter-seg.close { background: var(--warn-hero); } .meter-seg.over { background: var(--bad-hero); }
.meter-over { height: 100%; background: repeating-linear-gradient(135deg, var(--bad-hero) 0 4px, color-mix(in srgb, var(--bad-hero) 55%, var(--hero)) 4px 8px); flex: none; }
.meter-pace { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--hero-ink); border-radius: 1px; }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--hero-2); }
.hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hero-line); }
.stat .label { color: var(--hero-2); font-size: 13px; font-weight: 500; }
.stat .val { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
.stat .val.over { color: var(--bad-hero); }
.stat .sub { font-size: 12.5px; color: var(--hero-2); margin-top: 2px; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 2px 8px; border-radius: 12px; border: 1px solid transparent; background: transparent; min-width: 0;
}
.day:hover { background: var(--surface-2); }
.day[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.day .dname { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.day .dnum { font-size: 11.5px; color: var(--muted); margin-top: -6px; }
.day .bar-wrap { height: 72px; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.day .bar { width: min(22px, 70%); border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
.day .bar.zero { background: var(--line-strong); }
.day .bar.future { background: transparent; border: 1px dashed var(--line-strong); border-bottom: 0; min-height: 0; }
.day .damt { font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.day .damt.zero { color: var(--muted); font-weight: 500; }
.day.today .dname { color: var(--accent); }
.day.today::before { content: ""; position: absolute; top: 3px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.days-ref { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line-strong); pointer-events: none; }
.days-shell { position: relative; }
.days-caption { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

.receipt { list-style: none; margin: 0; padding: 0; }
.receipt li { }
.rrow { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 10px 2px; background: none; border: 0; text-align: left; border-bottom: 1px dashed var(--line); }
.receipt li:last-child .rrow { border-bottom: 0; }
.rrow:hover .rname { color: var(--accent); }
.rmain { flex: 1; min-width: 0; }
.rname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.rsub { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ramt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.ramt small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.rtotal { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; margin-top: 4px; border-top: 2px solid var(--ink); font-weight: 700; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.daycard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.daycard-head h2 { margin: 0; font-size: 17px; }
.daycard-total { font-size: 22px; font-weight: 600; }
.mini-result { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; }
.mini-result:hover { border-color: var(--line-strong); }
.mini-result .t { font-size: 13px; color: var(--muted); }
.mini-result .v { font-weight: 600; font-size: 16px; }
.mini-result .v small { font-weight: 500; font-size: 13px; }
.v .good { color: var(--good-ink); } .v .bad { color: var(--bad-ink); }

/* ---------- Transactions ---------- */
.toolbar { display: grid; gap: 10px; margin-bottom: 12px; }
.search { position: relative; }
.search svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.summary-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); margin: 4px 2px 8px; flex-wrap: wrap; }
.summary-line strong { color: var(--ink); }
.dgroup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px 14px; margin-bottom: 10px; }
.dgroup-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px 6px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- Analytics ---------- */

.cc-tick { position: absolute; height: 0; border-top: 2px solid var(--ink-2); width: 60%; left: 20%; }

.sheet {
  position: relative; width: 100%; max-width: 640px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 12px);
  background: var(--surface); border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop); animation: rise 0.22s cubic-bezier(.2,.8,.2,1);
}
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; min-width: 0; font-family: var(--font-display); letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; align-content: start; }
.sheet-foot { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
@media (min-width: 720px) {
  .sheet-wrap { align-items: center; padding: 24px; }

  .sheet-foot { padding-bottom: 12px; border-radius: 0 0 20px 20px; }
}
@keyframes rise { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-backdrop { animation: none; } * { transition: none !important; } }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -4px; }

/* Add sheet */
.add-date { display: flex; align-items: center; gap: 6px; }
.date-chip { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }

.pv { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.pv-item.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.pv-top { display: flex; align-items: baseline; gap: 10px; }
.pv-name { flex: 1; min-width: 0; font-weight: 600; }
.pv-name small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
.pv-amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.pv-amt small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.pv-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-select { position: relative; display: inline-flex; align-items: center; height: 30px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); padding: 0 26px 0 10px; font-size: 13px; font-weight: 600; color: var(--ink); max-width: 100%; }
.chip-select::after { content: ""; position: absolute; right: 10px; top: 11px; width: 5px; height: 5px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); }

.add-foot-total { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); }
.add-foot-total strong { display: block; color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }

/* Editor */
.amount-row { display: grid; grid-template-columns: 1fr 104px; gap: 10px; }

.fxbox { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; font-size: 14px; }
.fxline { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.split-rows { display: grid; gap: 10px; }
.split-row { display: grid; grid-template-columns: minmax(0, 1fr) 112px 40px; gap: 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.split-row .full { grid-column: 1 / -1; }
.split-row .two { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);

.tip { position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.35; padding: 8px 10px; border-radius: 10px; max-width: 240px; box-shadow: var(--shadow-pop); white-space: pre-line; font-variant-numeric: tabular-nums; }

<div class="tip" id="tip" hidden></div>
<script>
/* Standalone runtime: gives the app the same small surface it uses inside Claude
   (claude.use("db") / ("downloads")), backed by this device's IndexedDB.
   Nothing leaves the phone except exchange-rate lookups (dates only). */
(function () {
  "use strict";
  window.ALLOWANCE_STANDALONE = true;
  const DB_NAME = "allowance", STORE = "docs", LS_PREFIX = "allowance:doc:";
  const mem = new Map(); // path -> { data, version }
  const listeners = new Set();
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let idb = null, useLS = false, volatile = false;

  function openIdb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: "path" });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("blocked"));
    });
  }
  function idbAll() {
    return new Promise((resolve, reject) => {
      const q = idb.transaction(STORE, "readonly").objectStore(STORE).getAll();
      q.onsuccess = () => resolve(q.result || []);
      q.onerror = () => reject(q.error);
    });
  }
  const ready = (async () => {
    try {
      if (!window.indexedDB) throw new Error("no indexedDB");
      idb = await openIdb();
      for (const row of await idbAll()) mem.set(row.path, { data: row.data, version: row.version || 1 });
    } catch (e) {
      idb = null;
      try {
        localStorage.setItem(LS_PREFIX + "__probe", "1"); localStorage.removeItem(LS_PREFIX + "__probe");
        useLS = true;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(LS_PREFIX)) { try { mem.set(k.slice(LS_PREFIX.length), JSON.parse(localStorage.getItem(k))); } catch (e2) { /* skip */ } }
        }
      } catch (e3) { volatile = true; }
    }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* optional */ }
  })();

  function persist(path, entry) {
    if (idb) {
      return new Promise((resolve, reject) => {
        const tx = idb.transaction(STORE, "readwrite");
        const st = tx.objectStore(STORE);
        if (entry) st.put({ path, data: entry.data, version: entry.version }); else st.delete(path);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      }).catch((e) => { throw { code: e && e.name === "QuotaExceededError" ? "quota_exceeded" : "unavailable", message: String(e) }; });
    }
    if (useLS) {
      try { if (entry) localStorage.setItem(LS_PREFIX + path, JSON.stringify(entry)); else localStorage.removeItem(LS_PREFIX + path); return Promise.resolve(); }
      catch (e) { return Promise.reject({ code: "quota_exceeded", message: String(e) }); }
    }
    return Promise.resolve();
  }

  // Other open tabs of the app stay in step.
  const bc = typeof BroadcastChannel === "function" ? new BroadcastChannel("allowance") : null;
  if (bc) bc.onmessage = (ev) => {
    const m = ev.data || {};
    if (!m.path) return;
    if (m.entry) mem.set(m.path, m.entry); else mem.delete(m.path);
    notify();
  };
  let pending = false;
  function notify() { if (pending) return; pending = true; setTimeout(() => { pending = false; for (const l of Array.from(listeners)) { try { l.fire(); } catch (e) { /* listener error */ } } }, 0); }

  function snapDoc(path) {
    const e = mem.get(path);
    const d = e ? Object.freeze(clone(e.data)) : undefined;
    return { id: path.split("/").pop(), exists: !!e, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } };
  }
  async function write(path, data) {
    await ready;
    if (!data || typeof data !== "object" || Array.isArray(data)) throw { code: "invalid_argument", message: "Document must be an object" };
    const prev = mem.get(path);
    const entry = { data: clone(data), version: (prev ? prev.version : 0) + 1 };
    await persist(path, entry);
    mem.set(path, entry);
    if (bc) bc.postMessage({ path, entry });
    notify();
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      async get() { await ready; return snapDoc(path); },
      set(data) { return write(path, data); },
      async update(data) { await ready; const prev = mem.get(path); if (!prev) throw { code: "invalid_argument", message: "Document does not exist" }; return write(path, Object.assign({}, prev.data, data)); },
      async delete() { await ready; await persist(path, null); mem.delete(path); if (bc) bc.postMessage({ path, entry: null }); notify(); },
      async acquire(o) { return { acquired: true, version: 1, expiresAt: new Date(Date.now() + ((o && o.ttlMs) || 30000)).toISOString(), holder: o && o.holder }; },
      onSnapshot(next) { const l = { fire: () => next(snapDoc(path)) }; listeners.add(l); ready.then(() => l.fire()); return () => listeners.delete(l); },
      collection(sub) { return colRef(path + "/" + sub); }
    };
  }
  function querySnap(path, filters, lim) {
    const depth = path.split("/").length + 1;
    let docs = Array.from(mem.keys()).filter((k) => k.startsWith(path + "/") && k.split("/").length === depth).sort().map(snapDoc);
    docs = docs.filter((d) => filters.every(([f, op, v]) => {
      const x = d.data()[f];
      if (op === "==") return x === v; if (op === "!=") return x !== v;
      if (op === "<") return x < v; if (op === "<=") return x <= v; if (op === ">") return x > v; if (op === ">=") return x >= v;
      return true;
    }));
    if (lim) docs = docs.slice(0, lim);
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function query(path, filters, lim) {
    const q = {
      where(f, op, v) { return query(path, filters.concat([[f, op, v]]), lim); },
      orderBy() { return q; },
      limit(n) { return query(path, filters, n); },
      async get() { await ready; return querySnap(path, filters, lim); },
      onSnapshot(next) { const l = { fire: () => next(querySnap(path, filters, lim)) }; listeners.add(l); ready.then(() => l.fire()); return () => listeners.delete(l); }
    };

    return null;
  }

  function keywordHit(text) {
    const t = " " + norm(text) + " ";
    for (const [re, cat, type, strong] of KEYWORDS) {
      if (re.test(t)) return { category: cat, type, strong };
    }
    return null;
  }

  // ---------- Quick-entry parser ----------
  const AMT = "(?:\\$\\s?)?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d{1,2})?|\\$?\\.\\d{1,2}";
  const AMT_RE = new RegExp(`(^|[^\\w.$])(-|−)?(${AMT})(?![\\d.,]*\\d)`, "g");

  function findAmounts(text) {
    const out = [];
    AMT_RE.lastIndex = 0;
    let m;
    while ((m = AMT_RE.exec(text))) {
      const raw = m[3];
      const start = m.index + m[1].length;
      const cents = parseMoney(raw);
      if (cents === null) continue;
      out.push({ raw, start, end: m.index + m[0].length, cents, neg: !!m[2], hasDollar: raw.includes("$") });
    }
    return out;
  }

  // Splits written like "but $10 was Tide pens", "$10 of it was X", "and X was $10".
  function parseSplits(desc, totalCents) {
    const splits = [];
    let rest = desc;
    const pats = [
      // amount then item: "but $10 was tide pens", "incl $12.50 for snacks", "$10 of that was X"
      new RegExp(`(?:,|;|\\bbut\\b|\\band\\b|\\bincl(?:uding|\\.)?\\b|\\bplus\\b|\\bwith\\b)?\\s*(${AMT})\\s+(?:of (?:it|that|this) )?(?:was|were|is|are|for|on|in)\\s+([^,;]+?)(?=\\s*(?:,|;|\\band\\b\\s*\\$?\\d|\\bbut\\b|$))`, "i"),
      // item then amount: "but the tide pens were $10"
      new RegExp(`(?:,|;|\\bbut\\b|\\band\\b)\\s*(?:the\\s+)?([a-z][a-z'\\s-]{1,40}?)\\s+(?:was|were|cost|costs|=)\\s+(${AMT})(?=\\s*(?:,|;|\\band\\b|\\bbut\\b|$))`, "i")
    ];
    for (let guard = 0; guard < 6; guard++) {
      let hit = null, cents = null, item = null, whole = null;
      const m1 = pats[0].exec(rest);
      if (m1) { hit = m1; cents = parseMoney(m1[1]); item = m1[2]; whole = m1[0]; }
      else {
        const m2 = pats[1].exec(rest);
        if (m2) { hit = m2; cents = parseMoney(m2[2]); item = m2[1]; whole = m2[0]; }
      }
      if (!hit || cents === null || cents <= 0) break;
      item = item.replace(/^(the|some)\s+/i, "").trim();
      splits.push({ cents, item });
      rest = (rest.slice(0, hit.index) + " " + rest.slice(hit.index + whole.length)).replace(/\s+/g, " ").trim();
    }
    if (!splits.length) return null;
    const used = splits.reduce((a, s) => a + s.cents, 0);
    if (used >= totalCents) return { error: "Split amounts add up to more than the total.", splits, rest };
    return { splits, rest, remainder: totalCents - used };
  }

  function cleanDesc(s) {
    return String(s || "").replace(/^[\s\-–—:,.;]+|[\s\-–—:,.;]+$/g, "").replace(/\s+/g, " ").trim();
  }
  function stripQualifiers(s) { // "mostly supplements" -> "supplements"
    return cleanDesc(String(s || "").replace(/\b(mostly|mainly|mostly for|for|some|bunch of|stuff|misc|various|the rest( was)?|rest)\b/gi, " "));
  }

  function classify(merchantName, desc, idxEntry) {
    const kw = desc ? keywordHit(desc) : null;
    if (kw && kw.strong) return { category: kw.category, type: kw.type, confident: true, via: "description" };
    if (idxEntry) return { category: idxEntry.category, type: idxEntry.type || (kw ? kw.type : ""), confident: true, via: idxEntry.learned ? "learned" : "known" };
    if (kw) return { category: kw.category, type: kw.type, confident: true, via: "description" };
    const nm = norm(merchantName);
    for (const [re, cat] of NAME_PATTERNS) if (re.test(nm)) return { category: cat, type: "", confident: true, via: "name" };
    const kwName = keywordHit(merchantName);
    if (kwName) return { category: kwName.category, type: kwName.type, confident: kwName.strong, via: "name" };
    return { category: "Miscellaneous", type: "", confident: false, via: "none" };
  }

  // Parse one line into expense draft(s). ctx: {date, merchantIndex, merchantGroups}
  function parseLine(line, ctx) {
    const original = line;
    let text = " " + String(line).replace(/[ \t]/g, " ").trim() + " ";
    const res = { line: original.trim(), items: [], issues: [], error: null };
    if (!res.line) return null;

    // Date words
    let date = ctx.date;
    if (/\b(yesterday|yday|ystd)\b/i.test(text)) { date = addDays(ctx.date, -1); text = text.replace(/\b(yesterday|yday|ystd)\b/i, " "); }

    // Currency
    let currency = "CAD";
    if (/(?:\b|(?<=\d))(usd|us dollars?)\b|\bus\s*\$|\$\s*us\b|\bus(?=\s*\d)|(?<=\d)\s*us\b/i.test(text)) {
      currency = "USD";
      text = text.replace(/(?:\b|(?<=\d))(usd|us dollars?)\b/ig, " ").replace(/\bus\s*\$/ig, " $").replace(/\$\s*us\b/ig, "$ ").replace(/\bus\b(?=\s*\d)/ig, " ").replace(/(?<=\d)\s*us\b/ig, " ");
    }
    text = text.replace(/(?:\b|(?<=\d))(cad|c\$|ca\$)(?=\s|$)/ig, " ");

    // Refund
    let refund = false;
    if (/\b(refund|refunded|return(ed)?|credit)\b/i.test(text)) refund = true;

    let qty = 1, cents, negative, remainder;
    // "3 x 4.50 parking" / "2× 17.85 parking": a count, then the amount for each
    const qtyLead = text.match(new RegExp(`^\\s*(\\d{1,2})\\s?(?:x|×)\\s?(${AMT})(?![\\d.,]*\\d)`, "i"));
    if (qtyLead && parseMoney(qtyLead[2]) !== null) {
      qty = Number(qtyLead[1]);
      cents = parseMoney(qtyLead[2]);
      negative = refund;
      remainder = text.slice(qtyLead[0].length);
    } else {
      const amounts = findAmounts(text);
      if (!amounts.length) { res.error = "No amount found"; return res; }

      // Primary amount: the first amount at the start, else the last amount at the end, else the first.
      const lead = text.replace(/^\s+/, "");
      const leadOffset = text.length - lead.length;
      let primary = amounts.find((a) => a.start <= leadOffset + 1);
      if (!primary) {
        const tail = amounts[amounts.length - 1];
        if (text.slice(tail.end).trim() === "") primary = tail;
      }
      if (!primary) primary = amounts[0];

      // Quantity right after (or right before) the primary amount: "17.85 x2", "2x 17.85", "17.85 × 2"
      let after = text.slice(primary.end);
      let before = text.slice(0, primary.start);
      const qm = after.match(/^\s*(?:x|×|\*)\s?(\d{1,2})\b(?!\.\d)/i);
      if (qm) { qty = Number(qm[1]); after = after.slice(qm[0].length); }
      else {
        const qb = before.match(/\b(\d{1,2})\s?(?:x|×)\s*$/i);
        if (qb) { qty = Number(qb[1]); before = before.slice(0, before.length - qb[0].length); }
      }
      cents = primary.cents;
      negative = primary.neg || refund;
      remainder = before + " " + after;
    }
    // "parking x3" at the end of the line
    if (qty === 1) {
      const qt = remainder.match(/\s(?:x|×)\s?(\d{1,2})\s*$/i);
      if (qt) { qty = Number(qt[1]); remainder = remainder.slice(0, qt.index); }
    }
    if (!(qty >= 1 && qty <= 20)) qty = 1;
    remainder = cleanDesc(remainder.replace(/\s+/g, " "));
    remainder = remainder.replace(/^\s*(at|@|from|on)\s+/i, "");

    // Splits ("but $10 was Tide pens")
    let splitInfo = null;
    if (qty === 1 && !negative) {
      const sp = parseSplits(remainder, cents);
      if (sp && sp.error) res.issues.push(sp.error);
      else if (sp) { splitInfo = sp; remainder = cleanDesc(sp.rest); }
    }
    const leftover = findAmounts(remainder);
    if (leftover.length) res.issues.push("There's another amount in this line. Check whether it should be a split.");

    // Merchant
    const words = norm(remainder).split(" ").filter(Boolean);
    const idx = ctx.merchantIndex;
    let merchant = "", desc = "", idxEntry = null;
    const mm = words.length ? matchMerchant(words, idx) : null;
    if (mm) {
      idxEntry = mm.m;
      merchant = mm.m.name;
      // description = the original-case words that are not the merchant words
      const rawWords = remainder.split(/\s+/).filter(Boolean);
      const normWords = rawWords.map((w) => norm(w));
      // map normalized index to raw words (best effort when tokens align 1:1)
      if (normWords.filter(Boolean).length === words.length) {
        const keep = [];
        let wi = 0;
        rawWords.forEach((rw, i) => {
          const nw = normWords[i];
          if (!nw) { keep.push(rw); return; }
          const parts = nw.split(" ").length;
          const inMerchant = wi >= mm.at && wi < mm.at + mm.len;
          if (!inMerchant) keep.push(rw);
          wi += parts;
        });
        desc = cleanDesc(keep.join(" ").replace(/^\s*(at|@|from|on|-)\s+/i, "").replace(/\s+(at|@|from)\s*$/i, ""));
      } else {
        desc = cleanDesc(words.filter((_, i) => i < mm.at || i >= mm.at + mm.len).join(" "));
      }
    } else if (words.length) {
      const rawWords = remainder.split(/\s+/).filter(Boolean);
      const atIdx = rawWords.findIndex((w, i) => i > 0 && i < rawWords.length - 1 && /^(at|@)$/i.test(w));
      const withIdx = rawWords.findIndex((w, i) => i > 0 && /^(with|for)$/i.test(w));
      if (atIdx > 0) { merchant = titleCase(rawWords.slice(atIdx + 1).join(" ")); desc = cleanDesc(rawWords.slice(0, atIdx).join(" ")); }
      else if (withIdx > 0 && withIdx <= 3) { merchant = titleCase(rawWords.slice(0, withIdx).join(" ")); desc = cleanDesc(rawWords.slice(withIdx).join(" ")); }
      else if (rawWords.length <= 3) { merchant = titleCase(remainder); desc = ""; }
      else { merchant = titleCase(rawWords.slice(0, 2).join(" ")); desc = cleanDesc(rawWords.slice(2).join(" ")); res.issues.push("New merchant. Check the name."); }
    } else {
      merchant = "Unknown";
      res.issues.push("No merchant or description.");
    }
    desc = desc.replace(/\b(refund|refunded|returned|return|credit)\b/ig, "").replace(/\s+/g, " ").trim();

    const merchantIsGroup = (ctx.merchantGroups || []).some((g) => norm(g) === norm(merchant));
    const mainDesc = stripQualifiers(desc);
    const cls = classify(merchant, mainDesc || desc, idxEntry);
    let category = cls.category, type = cls.type;
    if (merchantIsGroup && !type) {
      const kw = keywordHit(mainDesc || desc);
      if (kw && kw.type) type = kw.type;
    }
    const confident = cls.confident && !(merchantIsGroup && !type && !splitInfo);
    if (!cls.confident) res.issues.unshift("New merchant. Pick a category.");
    else if (merchantIsGroup && !type && !splitInfo) res.issues.unshift(`What was this ${merchant} purchase? Pick a category.`);

    // Build splits
    let splits = [];
    if (splitInfo) {
      const mainKw = keywordHit(mainDesc);
      const main = {
        category: mainKw && mainKw.strong ? mainKw.category : category,
        type: (mainKw && mainKw.type) || type || "",
        note: mainDesc && !(mainKw && mainKw.type && norm(mainKw.type) === norm(mainDesc)) ? sentenceCase(mainDesc) : "",
        amount_cents: splitInfo.remainder
      };
      const parts = splitInfo.splits.map((s) => {
        const k = keywordHit(s.item);
        const fallback = idxEntry ? idxEntry.category : category;
        return { category: k && k.strong ? k.category : fallback, type: (k && k.type) || "", note: sentenceCase(s.item), amount_cents: s.cents };
      });
      splits = [main, ...parts];
      if (main.note && main.type && norm(main.note) === norm(main.type)) main.note = "";
      // Top-level category of the whole: the largest portion's category
      const largest = splits.slice().sort((a, b) => b.amount_cents - a.amount_cents)[0];
      category = largest.category;
      type = largest.type;
      // Description reads as the parts: "Supplements and Tide pens" (brand capitals kept as typed)
      const raw = splits.map((s) => s.note || s.type);
      if (raw.every(Boolean)) desc = sentenceCase(raw.length > 1 ? raw.slice(0, -1).join(", ") + " and " + raw[raw.length - 1] : raw[0]);
      else desc = sentenceCase(desc);
    }

    const signed = negative ? -Math.abs(cents) : cents;
    const description = /^(with|for)\s/i.test(desc) ? desc : sentenceCase(desc);
    for (let i = 0; i < qty; i++) {
      res.items.push({
        date, merchant, description, currency,
        original_cents: signed, // in original currency
        amount_cents: currency === "CAD" ? signed : null, // CAD filled after FX
        category, type, splits: splits.map((s) => Object.assign({}, s)),
        review: confident ? "" : "category",
        qty_index: qty > 1 ? i + 1 : 0, qty
      });
    }
    res.confident = confident;
    return res;
  }

  function parseEntry(textBlock, ctx) {
    const lines = String(textBlock || "").split(/\n/);
    const out = [];
    for (const l of lines) {
      if (!l.trim()) continue;
      const r = parseLine(l, ctx);
      if (r) out.push(r);
    }
    return out;
  }

  // ---------- Ledger ----------
  // Merge month documents into one de-duplicated list (same id in two buckets: newest revision wins).
  function mergeLedger(monthDocs) {
    const byId = new Map();
    for (const doc of monthDocs) {
      const list = (doc && doc.txns) || [];
      for (const t of list) {
        if (!t || !t.id) continue;
        const prev = byId.get(t.id);
        if (!prev || newer(t, prev)) byId.set(t.id, t);
      }
    }
    return Array.from(byId.values()).filter(validTxn).sort(cmpTxn);
  }
  function newer(a, b) {
    if ((a.rev || 0) !== (b.rev || 0)) return (a.rev || 0) > (b.rev || 0);
    return String(a.updated_at || "") > String(b.updated_at || "");
  }
  function validTxn(t) { return isDate(t.date) && Number.isSafeInteger(t.amount_cents); }
  function cmpTxn(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.created_at || "").localeCompare(String(b.created_at || "")) || a.id.localeCompare(b.id); }

  function validateTxn(t) {
    const errs = [];
    if (!isDate(t.date)) errs.push("Pick a valid date.");
    if (!Number.isSafeInteger(t.amount_cents)) errs.push("Enter an amount.");
    if (!String(t.merchant || "").trim()) errs.push("Enter a merchant.");
    if (!CATEGORIES.includes(t.category)) errs.push("Pick a category.");
    if (t.currency === "USD" && !Number.isSafeInteger(t.original_cents)) errs.push("Enter the US dollar amount.");
    if (t.splits && t.splits.length) {
      if (t.splits.length < 2) errs.push("A split needs at least two parts.");
      const sum = t.splits.reduce((a, s) => a + (Number.isSafeInteger(s.amount_cents) ? s.amount_cents : NaN), 0);
      if (!Number.isFinite(sum)) errs.push("Every split part needs an amount.");
      else if (sum !== t.amount_cents) errs.push(`Split parts add up to ${fmt(sum)}, not ${fmt(t.amount_cents)}.`);
      for (const s of t.splits) if (!CATEGORIES.includes(s.category)) { errs.push("Every split part needs a category."); break; }
    }
    return errs;
  }

  // For USD splits: scale split parts (entered in USD) to CAD so they still sum exactly to the CAD total.
  function scaleSplits(splitsOrig, origTotal, cadTotal) {
    if (!splitsOrig || !splitsOrig.length) return [];
    if (origTotal === cadTotal) return splitsOrig.map((s) => Object.assign({}, s));
    let used = 0;
    const out = splitsOrig.map((s, i) => {
      const c = i === splitsOrig.length - 1 ? null : Math.round((s.amount_cents * cadTotal) / origTotal);
      if (c !== null) used += c;
      return Object.assign({}, s, { amount_cents: c });
    });
    out[out.length - 1].amount_cents = cadTotal - used;
    return out;
  }

  function portions(t) {
    if (t.splits && t.splits.length) return t.splits.map((s) => ({ category: s.category, type: s.type || "", note: s.note || "", cents: s.amount_cents }));
    return [{ category: t.category, type: t.type || "", note: "", cents: t.amount_cents }];
  }

  function inRange(t, a, b) { return t.date >= a && t.date <= b; }
  function sumCents(list) { let s = 0; for (const t of list) s += t.amount_cents; return s; }
  function txnsIn(txns, a, b) { return txns.filter((t) => inRange(t, a, b)); }

  // ---------- Budget ----------
  function sortedBudgets(settings) {
    const b = ((settings && settings.budgets) || DEFAULT_SETTINGS.budgets).filter((x) => isDate(x.from) && Number.isSafeInteger(x.weekly_cents));
    return b.slice().sort((x, y) => (x.from < y.from ? -1 : 1));
  }
  function weeklyBudget(ws, settings) {
    const list = sortedBudgets(settings);
    let v = list.length ? list[0].weekly_cents : 105000;
    for (const e of list) if (e.from <= ws) v = e.weekly_cents;
    return v;
  }

  function weekSummary(txns, anyDate, settings) {
    const ws = weekStart(anyDate), we = addDays(ws, 6);
    const days = [];
    for (let i = 0; i < 7; i++) days.push({ date: addDays(ws, i), cents: 0, count: 0 });
    for (const t of txns) {
      if (t.date < ws || t.date > we) continue;
      const d = days[diffDays(ws, t.date)];
      d.cents += t.amount_cents; d.count += 1;
    }
    const total = days.reduce((a, d) => a + d.cents, 0);
    const budget = weeklyBudget(ws, settings);
    return { start: ws, end: we, week: isoWeek(ws), days, total, budget, remaining: budget - total };
  }

  /* Allowance for the rest of the week, as of a selected day.
     - Selected day has no spending yet: count it as a day you can still spend on.
     - Selected day has spending: divide by the days after it.
     - Sunday: show what's left instead of dividing.
     - Over budget: show the overspend instead of a daily figure.
     Spending counted: up to the selected day when it is in the past; the whole week otherwise. */
  function allowance(txns, selected, today, settings) {
    const w = weekSummary(txns, selected, settings);
    const idx = dayIndex(selected);
    const cutoff = selected < today ? selected : w.end;
    let spent = 0;
    for (const d of w.days) if (d.date <= cutoff) spent += d.cents;
    const remaining = w.budget - spent;
    const day = w.days[idx];
    const hasSpending = day.count > 0;
    const out = { week: w, selected, spent, remaining, budget: w.budget, hasSpending, asOfPast: selected < today };
    if (remaining < 0) return Object.assign(out, { kind: "over", over: -remaining });
    if (hasSpending) {
      const n = 6 - idx;
      if (n === 0) return Object.assign(out, { kind: "last", days: 0, perDay: remaining, dayNames: [] });
      return Object.assign(out, { kind: "after", days: n, perDay: Math.floor(remaining / n), dayNames: DOW.slice(idx + 1) });
    }
    const n = 7 - idx;
    if (n === 1) return Object.assign(out, { kind: "last", days: 1, perDay: remaining, dayNames: ["Sun"] });
    return Object.assign(out, { kind: "including", days: n, perDay: Math.floor(remaining / n), dayNames: DOW.slice(idx) });
  }

  function budgetStatus(total, budget) {
    if (total > budget) return "over";
    if (total >= Math.round(budget * 0.8)) return "close";
    return "ok";
  }

  // ---------- Reporting groups ----------
  function isGroupMerchant(merchant, settings) {
    const g = ((settings && settings.merchant_groups) || DEFAULT_SETTINGS.merchant_groups);
    const n = norm(merchant);
    return g.find((x) => norm(x) === n) || null;
  }
  // Every portion of every transaction lands in exactly one group, so groups always add up to the total.
  function groupTotals(txns, settings) {
    const groups = new Map();
    for (const t of txns) {
      const gm = isGroupMerchant(t.merchant, settings);
      for (const p of portions(t)) {
        let key, kind, item;
        if (gm) { key = gm; kind = "merchant"; item = p.type || (p.note ? sentenceCase(p.note) : "") || (t.description ? sentenceCase(t.description) : "") || "Other"; }
        else { key = p.category || "Miscellaneous"; kind = "category"; item = NO_DETAIL.has(key) ? null : t.merchant; }
        let g = groups.get(key);
        if (!g) { g = { name: key, kind, cents: 0, count: 0, items: new Map() }; groups.set(key, g); }
        g.cents += p.cents; g.count += 1;
        if (item) g.items.set(item, (g.items.get(item) || 0) + p.cents);
      }
    }
    return Array.from(groups.values()).map((g) => ({
      name: g.name, kind: g.kind, cents: g.cents, count: g.count,
      items: Array.from(g.items.entries()).map(([name, cents]) => ({ name, cents })).sort((a, b) => b.cents - a.cents || a.name.localeCompare(b.name))
    })).sort((a, b) => b.cents - a.cents || a.name.localeCompare(b.name));
  }
  function topGroups(txns, settings, n) { return groupTotals(txns, settings).filter((g) => g.cents > 0).slice(0, n || 5); }

  function categoryTotals(txns) {
    const m = new Map();
    for (const t of txns) for (const p of portions(t)) m.set(p.category, (m.get(p.category) || 0) + p.cents);
    return Array.from(m.entries()).map(([name, cents]) => ({ name, cents })).sort((a, b) => b.cents - a.cents || a.name.localeCompare(b.name));
  }
  function merchantTotals(txns) {
    const m = new Map();
    for (const t of txns) {
      const k = norm(t.merchant);
      const e = m.get(k) || { name: t.merchant, cents: 0, count: 0 };
      e.cents += t.amount_cents; e.count += 1; m.set(k, e);
    }
    return Array.from(m.values()).sort((a, b) => b.cents - a.cents || a.name.localeCompare(b.name));
  }

  // ---------- Reports ----------
  function weekReport(txns, anyDate, settings, today) {
    const w = weekSummary(txns, anyDate, settings);
    const list = txnsIn(txns, w.start, w.end);
    return Object.assign(w, {
      final: w.end < today, inProgress: w.start <= today && today <= w.end,
      diff: w.budget - w.total, status: budgetStatus(w.total, w.budget),
      top: topGroups(list, settings, 5), count: list.length
    });
  }

  function monthBenchmark(mk, settings, uptoDate) {
    // Weekly budget prorated per day: sum of (weekly budget / 7) for each day of the month (or up to a date).
    let num = 0;
    const end = uptoDate && uptoDate < monthEnd(mk) ? uptoDate : monthEnd(mk);
    for (const d of eachDay(monthStart(mk), end)) num += weeklyBudget(weekStart(d), settings);
    return Math.floor((num + 3) / 7); // num/7 rounded half up
  }

  function monthReport(txns, mk, settings, today) {
    const a = monthStart(mk), b = monthEnd(mk);
    const complete = b < today;
    const started = a <= today;
    const cutoff = complete ? b : (started ? today : a);
    const list = txnsIn(txns, a, b);
    const total = sumCents(list);
    const days = eachDay(a, b).map((d) => ({ date: d, cents: 0, count: 0 }));
    for (const t of list) { const d = days[diffDays(a, t.date)]; d.cents += t.amount_cents; d.count += 1; }
    const counted = days.filter((d) => d.date <= cutoff);
    const nDays = complete ? days.length : Math.max(counted.length, 1);
    let hi = null, lo = null;
    for (const d of counted) {
